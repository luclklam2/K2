<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jadon 每日一練</title>
  <style>
    :root {
      --paper: #fbf9ff;
      --paper-line: #e8e1ff;
      --page-border: #b7a8ef;
      --ink: #403764;
      --muted: #706890;
      --purple: #9b84e8;
      --purple-deep: #7a63d9;
      --blue: #7fb6ff;
      --yellow: #ffd96a;
      --pink: #ffbfdc;
      --mint: #bfeecf;
      --peach: #ffd4b2;
      --white: #ffffff;
      --shadow: 0 16px 40px rgba(79, 62, 136, 0.16);
      --dash: 2px dashed #b9b0e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(var(--paper-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line) 1px, transparent 1px),
        linear-gradient(180deg, #f4f0ff, #ecf6ff);
      background-size: 28px 28px, 28px 28px, 100% 100%;
      padding: 14px;
    }

    .fun-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .floating-sticker {
      position: absolute;
      filter: drop-shadow(0 10px 12px rgba(79, 62, 136, 0.18));
      opacity: 0.78;
      animation: floatSticker 6s ease-in-out infinite;
    }

    .floating-sticker.hero {
      top: 8%;
      left: 3%;
      font-size: 3rem;
    }

    .floating-sticker.fire {
      top: 18%;
      right: 4%;
      font-size: 3.2rem;
      animation-delay: -1.4s;
    }

    .floating-sticker.pyramid {
      bottom: 12%;
      left: 4%;
      font-size: 3.5rem;
      animation-delay: -2.2s;
    }

    .floating-sticker.sparkle {
      right: 6%;
      bottom: 8%;
      font-size: 3rem;
      animation-delay: -3s;
    }

    @keyframes floatSticker {
      0%, 100% {
        transform: translateY(0) rotate(-4deg) scale(1);
      }
      50% {
        transform: translateY(-18px) rotate(5deg) scale(1.08);
      }
    }

    .sheet {
      width: min(1120px, 100%);
      margin: 0 auto;
      background: var(--paper);
      border: 4px solid var(--page-border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 18px;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .sheet::before,
    .sheet::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      opacity: 0.16;
      pointer-events: none;
    }

    .sheet::before {
      top: -30px;
      right: -20px;
      background: radial-gradient(circle, #a8cfff 0%, rgba(168, 207, 255, 0) 72%);
    }

    .sheet::after {
      bottom: -30px;
      left: -20px;
      background: radial-gradient(circle, #ffc4db 0%, rgba(255, 196, 219, 0) 72%);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .sticker {
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 900;
      font-size: 0.92rem;
      border: 2px solid #ffffff;
      box-shadow: 0 8px 18px rgba(122, 99, 217, 0.18);
      white-space: nowrap;
    }

    .sticker {
      background: linear-gradient(135deg, #d7ecff, #f7deff);
      color: #5d63aa;
    }

    .mascot-panel {
      margin-top: 14px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 2px solid #f2ddff;
      border-radius: 22px;
      background:
        radial-gradient(circle at 12% 20%, rgba(255, 217, 106, 0.38), transparent 26%),
        linear-gradient(135deg, #fff7fb, #eff8ff);
      box-shadow: 0 14px 24px rgba(122, 99, 217, 0.12);
    }

    .mascot-bubble {
      width: 58px;
      height: 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #fff;
      border: 2px solid #e7dcff;
      font-size: 2rem;
      animation: mascotBounce 1.8s ease-in-out infinite;
    }

    .mascot-panel strong {
      display: block;
      font-size: 1.25rem;
      line-height: 1.2;
    }

    .mascot-panel span {
      color: var(--muted);
      font-weight: 900;
    }

    .reward-row {
      display: flex;
      gap: 8px;
      font-size: 1.8rem;
    }

    .reward-row span {
      animation: popReward 1.7s ease-in-out infinite;
    }

    .reward-row span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .reward-row span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes mascotBounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes popReward {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.18) rotate(5deg);
      }
    }

    .title-badge {
      text-align: center;
      padding: 14px 18px;
      border-radius: 24px;
      background: linear-gradient(180deg, #ccb8ff, #a892f0);
      border: 4px solid #ede4ff;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5);
      width: 100%;
    }

    .title-badge h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: #3c2e70;
    }

    .name-strip {
      margin-top: 14px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 244, 255, 0.96));
      border: 2px dashed #b9b0e8;
      border-radius: 22px;
      padding: 10px 14px;
    }

    .name-strip-head {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 6px;
      min-height: 18px;
    }

    .name-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .name-field {
      display: grid;
      gap: 5px;
    }

    .name-field label {
      font-size: 0.88rem;
      font-weight: 900;
      color: var(--muted);
    }

    .name-input {
      min-height: 50px;
      border-radius: 14px;
      border: 2px solid #d9cffd;
      background: #fff;
      padding: 10px 14px;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--ink);
    }

    .control-panel {
      margin-top: 18px;
      background: rgba(255, 255, 255, 0.85);
      border: var(--dash);
      border-radius: 22px;
      padding: 16px;
    }

    .control-panel-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-size: 0.9rem;
      font-weight: 900;
      color: var(--muted);
    }

    select,
    input[type="number"] {
      width: 100%;
      min-height: 48px;
      border-radius: 16px;
      border: 2px solid #d9cffd;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      font-size: 1rem;
      font-weight: 900;
    }

    .summary {
      width: 270px;
      background: linear-gradient(180deg, #fffdf0, #fff7fe);
      border: 2px solid #f0e2ff;
      border-radius: 18px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .summary-box {
      background: #ffffff;
      border: var(--dash);
      border-radius: 16px;
      padding: 12px;
    }

    .summary-box strong {
      display: block;
      font-size: 1.35rem;
      margin-bottom: 4px;
    }

    .summary-box span {
      display: block;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      font-weight: 800;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      min-height: 50px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 900;
      color: var(--ink);
      box-shadow: 0 10px 20px rgba(122, 99, 217, 0.16);
    }

    .primary {
      background: linear-gradient(135deg, var(--purple-deep), var(--purple));
      color: #fff;
    }

    .secondary {
      background: linear-gradient(135deg, #ffeeb7, var(--yellow));
    }

    .ghost {
      background: linear-gradient(135deg, #def0ff, #bed8ff);
    }

    .print-btn {
      background: linear-gradient(135deg, #ffdbe8, #ffc2d7);
    }

    .lang-btn {
      background: linear-gradient(135deg, #e5f5d9, #c9efb8);
    }

    .questions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .card {
      background: #fff;
      border: var(--dash);
      border-radius: 22px;
      padding: 18px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #9b84e8;
      box-shadow: 0 14px 24px rgba(122, 99, 217, 0.16);
    }

    .card.done {
      animation: cardCelebrate 0.62s ease;
      border-color: #79cf91;
      box-shadow: 0 0 0 4px rgba(121, 207, 145, 0.18);
    }

    @keyframes cardCelebrate {
      0% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.025) rotate(-0.6deg);
      }
      100% {
        transform: scale(1);
      }
    }

    .card.sequence {
      background: linear-gradient(180deg, #ffffff, #fbf8ff);
    }

    .card.addsub {
      background: linear-gradient(180deg, #ffffff, #f8fcff);
    }

    .card.blending {
      background: linear-gradient(180deg, #ffffff, #fffaf0);
    }

    .card.chineseWriting {
      background: linear-gradient(180deg, #ffffff, #fff8f8);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-chip,
    .theme-mark {
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 900;
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .section-chip.sequence {
      background: linear-gradient(135deg, #bda8ff, #9a81ef);
      color: #fff;
    }

    .section-chip.addsub {
      background: linear-gradient(135deg, #86c0ff, #72a9ff);
      color: #fff;
    }

    .section-chip.blending {
      background: linear-gradient(135deg, #ffcf7a, #ffa8cf);
      color: #403764;
    }

    .section-chip.chineseWriting {
      background: linear-gradient(135deg, #ffb86f, #ff8fa3);
      color: #403764;
    }

    .theme-mark {
      min-width: 48px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 1.35rem;
      background: linear-gradient(135deg, #fff6fb, #ffe9f2);
      border: 2px solid #f0d6e5;
    }

    .card h3 {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.55;
    }

    .story {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.55;
      font-weight: 800;
    }

    .equation-box {
      margin-top: 16px;
      background: #fcfbff;
      border: 2px solid #e0d8ff;
      border-radius: 18px;
      padding: 20px 16px;
      text-align: center;
    }

    .equation {
      font-size: clamp(1.45rem, 3vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .visual-math {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .visual-group {
      min-width: 88px;
      display: grid;
      gap: 6px;
      justify-items: center;
    }

    .visual-count {
      font-size: 0.92rem;
      font-weight: 900;
      color: var(--muted);
    }

    .visual-icons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      max-width: 110px;
    }

    .visual-icon {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #fff;
      border: 2px solid #eadffd;
      font-size: 1.02rem;
      line-height: 1;
    }

    .pic-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .theme-mark .pic-img,
    .visual-icon .pic-img {
      width: 1.25em;
      height: 1.25em;
    }

    .blend-picture .pic-img {
      width: 92px;
      height: 72px;
      margin: 0 auto;
    }

    .writing-picture .pic-img {
      width: 82px;
      height: 82px;
    }

    .visual-operator,
    .visual-equals {
      align-self: center;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--ink);
      padding-top: 16px;
    }

    .visual-answer-line {
      width: 40px;
      height: 24px;
      border-bottom: 3px solid currentColor;
      align-self: center;
      margin-top: 10px;
    }

    .shape-pattern {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      color: #574a8f;
      font-size: 2rem;
      font-weight: 900;
    }

    .shape-options {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
    }

    .shape-choice {
      min-width: 70px;
      min-height: 58px;
      border: 3px solid #d9cffd;
      border-radius: 16px;
      background: #fff;
      color: #574a8f;
      font-size: 1.85rem;
      line-height: 1;
    }

    .shape-choice.selected {
      border-color: #8e72e6;
      background: #f1ebff;
    }

    .shape-choice.correct {
      border-color: #66c480;
      background: #effcf3;
    }

    .shape-choice.wrong {
      border-color: #f08383;
      background: #fff4f4;
    }

    .blend-pictures {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .card.blending .equation-box {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .card.blending .blend-pictures {
      grid-column: 1;
      grid-row: 1;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 12px;
      margin-bottom: 0;
    }

    .blend-picture {
      min-height: 102px;
      display: grid;
      place-items: center;
      border: 2px solid #eadffd;
      border-radius: 18px;
      background: linear-gradient(180deg, #fff, #f8f4ff);
      cursor: pointer;
      font-size: 2.5rem;
      box-shadow: none;
    }

    .blend-picture.selected {
      border-color: #9b84e8;
      background: #f1ebff;
      box-shadow: 0 0 0 4px rgba(155, 132, 232, 0.16);
    }

    .blend-picture.correct {
      border-color: #66c480;
      background: #effcf3;
    }

    .blend-picture.wrong {
      border-color: #f08383;
      background: #fff4f4;
    }

    .blend-bank {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card.blending .blend-bank {
      grid-column: 1;
      grid-row: 2;
      justify-content: center;
      align-content: center;
      margin-bottom: 0;
    }

    .blend-choice {
      min-height: 54px;
      min-width: 62px;
      border: 2px solid #eadffd;
      border-radius: 14px;
      background: #fff;
      padding: 6px 12px;
      color: #403764;
      font-size: 1.36rem;
      font-weight: 900;
      box-shadow: none;
    }

    .blend-choice:hover {
      background: #fff5df;
    }

    .blend-choice.selected {
      border-color: #9b84e8;
      background: #f1ebff;
    }

    .blend-pattern {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #403764;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .card.blending .equation {
      grid-column: 1 / -1;
      grid-row: 3;
      width: 100%;
    }

    .card.blending .blend-pattern {
      justify-content: center;
      padding: 4px 0 0;
      font-size: clamp(2.1rem, 3.8vw, 2.8rem);
    }

    .blend-blank {
      width: 1em;
      border-bottom: 4px solid currentColor;
      transform: translateY(0.08em);
    }

    .blend-fill {
      min-width: 1em;
      display: inline-block;
      text-align: center;
      text-transform: lowercase;
    }

    .writing-card {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-areas:
        "header"
        "demos"
        "sentence"
        "practice";
      gap: 12px;
      align-items: start;
      text-align: left;
    }

    .writing-header {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .writing-picture {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      border: 2px solid #eadffd;
      border-radius: 24px;
      background: #fff;
      font-size: 2.9rem;
      margin: 0 auto;
    }

    .writing-fullword {
      width: 108px;
      height: 108px;
      display: grid;
      place-items: center;
      border: 2px solid #eadffd;
      border-radius: 24px;
      background: #fff;
      color: #403764;
      font-size: 4.15rem;
      font-weight: 900;
      line-height: 1;
      margin: 0 auto;
      overflow: hidden;
    }

    .writing-fullword-char {
      display: inline-block;
      color: #4b4179;
      font-size: 1em;
      font-weight: 900;
      line-height: 1;
      transform: translateY(2px);
    }

    .writing-demos {
      grid-area: demos;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      min-width: 0;
    }

    .writing-demo {
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 6px;
      padding: 8px;
      border: 2px solid #eadffd;
      border-radius: 16px;
      background: linear-gradient(180deg, #fff, #fffaf6);
      min-width: 0;
    }

    .writing-demo-label {
      text-align: center;
      color: #6e639c;
      font-size: 0.92rem;
      font-weight: 900;
    }

    .writing-word {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      min-height: 90px;
      display: grid;
      place-items: center;
      border: 3px solid #d9cffd;
      border-radius: 16px;
      background:
        linear-gradient(90deg, transparent calc(50% - 1px), #eee6ff calc(50% - 1px), #eee6ff calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(transparent calc(50% - 1px), #eee6ff calc(50% - 1px), #eee6ff calc(50% + 1px), transparent calc(50% + 1px)),
        #fff;
      color: #403764;
      font-size: 3.1rem;
      font-weight: 900;
      line-height: 1;
    }

    .writing-word[data-writing-play] {
      cursor: pointer;
    }

    .writing-word-char {
      position: relative;
      z-index: 1;
    }

    .writing-word-glyph {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    .writing-word-ghost {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #d8d1f3;
      font-size: 3.1rem;
      font-weight: 900;
      line-height: 1;
      opacity: 0.38;
      z-index: 0;
      pointer-events: none;
    }

    .writing-word-svg {
      position: relative;
      width: 76%;
      height: 76%;
      overflow: hidden;
      z-index: 1;
    }

    .writing-word-svg path {
      fill: none;
      stroke: #4b4179;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .writing-stage-steps {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
      color: #6e639c;
      font-size: 0.92rem;
      font-weight: 900;
    }

    .stroke-step {
      min-width: 32px;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #eadffd;
      border-radius: 999px;
      background: #fff7df;
      color: #403764;
      font-size: 1rem;

      width: 156px;
      height: 156px;
      min-width: 156px;
      min-height: 156px;
      aspect-ratio: 1 / 1;
      flex: 0 0 156px;
      border-radius: 50%;
      background: #fff;

    function formatQuestion(question) {
      const text = textPack();
      if (question.type === "sequence") {
        const isReverse = question.direction === "reverse";
        const activity = question.activity[currentLanguage];
        const mainName = displayName(question.main);
        const helperName = displayName(question.helper);
        const itemName = question.item[currentLanguage];
        return {
          title: isReverse ? text.reverseSequenceTitle : text.sequenceTitle,
          prompt: isReverse
            ? activity.reverse(mainName, helperName, itemName)
            : activity.forward(mainName, helperName, itemName),
          clue: isReverse
            ? text.reverseSequenceClue(question.numbers[0], question.numbers[question.numbers.length - 1])
            : text.sequenceClue(question.numbers[0], question.numbers[question.numbers.length - 1]),
          speech: isReverse
            ? activity.reverse(mainName, helperName, itemName)
            : activity.forward(mainName, helperName, itemName),
          equation: question.shown.map((value) => value === null ? '<span class="missing-line"></span>' : value).join(" ")
        };
      }

      if (question.type === "clock") {
        const isDrawTask = question.clockTask === "draw";
        const activity = question.activity[currentLanguage];
        const mainName = displayName(question.main);
        const helperName = displayName(question.helper);
        return {
          title: text.clockTitle,
          prompt: isDrawTask
            ? activity.draw(mainName, helperName, question.answer)
            : activity.read(mainName, helperName),
          clue: currentLanguage === "zh"
            ? isDrawTask
              ? "短針表示小時，長針表示分鐘。"
              : "先睇短針，再睇長針。"
            : isDrawTask
              ? "The short hand shows the hour. The long hand shows the minutes."
              : "Look at the short hand first, then the long hand."
          ,
          speech: isDrawTask
            ? activity.draw(mainName, helperName, question.answer)
            : activity.read(mainName, helperName),
          equation: ""
        };
      }

      if (question.type === "logic") {
        const activity = question.activity[currentLanguage];
        const mainName = displayName(question.main);
        const helperName = displayName(question.helper);
        if (question.logicKind === "shape") {
          return {
            title: text.logicTitle,
            prompt: activity.shape(mainName, helperName),
            clue: currentLanguage === "zh"
              ? "留意圖形重複嘅次序。"
              : "Look at the repeating order of the shapes.",
            speech: activity.shape(mainName, helperName),
            equation: `<div class="shape-pattern">${question.shown.map((value) => value === null ? '<span class="missing-line"></span>' : `<span>${value}</span>`).join("")}</div>`
          };
        }

        return {
          title: text.logicTitle,
          prompt: activity.number(mainName, helperName),
          clue: text.logicClue(question.step),
          speech: activity.number(mainName, helperName),
          equation: question.shown.map((value) => value === null ? '<span class="missing-line"></span>' : value).join(" ")
        };
      }

      if (question.type === "blending") {
        const blanks = Array.from({ length: question.answer.length }, (_, index) =>
          `<span class="blend-blank" data-blend-slot="${index}"></span>`
        ).join("");
        return {
          title: text.blendingTitle,
          prompt: question.instruction.prompt,
          clue: question.instruction.clue,
          speech: question.instruction.prompt,
          equation: `<div class="blend-pattern">${blanks}<span>${question.tail}</span></div>`
        };
      }

      if (question.type === "chineseWriting") {
        return {
          title: text.chineseWritingTitle,
          prompt: text.chineseWritingPrompt(question.word),
          clue: text.chineseWritingClue,
          speech: `${text.chineseWritingPrompt(question.word)} ${question.sentence}`,
          equation: ""
        };
      }

      return {
        title: question.tensMode
          ? question.isAdd ? text.tensAddTitle : text.tensSubTitle
          : question.isAdd ? text.addTitle : text.subTitle,
        prompt: question.activity[currentLanguage][question.isAdd ? "add" : "sub"](
          displayName(question.main),
          displayName(question.helper),
          question.first,
          question.item[currentLanguage],
          question.second
        ),
        clue: text.addsubClue,
        speech: question.activity[currentLanguage][question.isAdd ? "add" : "sub"](
          displayName(question.main),
          displayName(question.helper),
          question.first,
          question.item[currentLanguage],
          question.second
        ),
        equation: `${question.first} ${question.operator} ${question.second} = ?`
      };
    }

    function buildChineseWritingGroups(strokes) {
      const groups = [];
      let start = 0;
      let remaining = strokes.length;

      for (let groupIndex = 0; groupIndex < 3; groupIndex += 1) {
        const groupsLeft = 3 - groupIndex;
        const size = remaining > 0 ? Math.ceil(remaining / groupsLeft) : 0;
        const chunk = strokes.slice(start, start + size).map((stroke, index) => ({
          name: stroke,
          number: start + index + 1
        }));
        groups.push(chunk);
        start += size;
        remaining = strokes.length - start;
      }

      return groups;
    }

    function renderClock(question) {
      if (question.type !== "clock") {
        return "";
      }

      const hourRotation = (question.hour % 12) * 30 + (question.minute * 0.5);
      const minuteRotation = question.minute * 6;
      const ticks = Array.from({ length: 12 }, (_, index) =>
        `<div class="clock-tick" style="transform: rotate(${index * 30}deg)"></div>`
      ).join("");
      const numbers = Array.from({ length: 12 }, (_, index) => {
        const number = index + 1;
        const rotation = number * 30;
        return `<div class="clock-number" style="transform: rotate(${rotation}deg) translateY(-58px) rotate(-${rotation}deg)">${number}</div>`;
      }).join("");
      const drawHourRotation = ((question.drawHour || 12) % 12) * 30;
      const drawMinuteRotation = (question.drawMinute || 0) * 6;
      const drawTimeLabel = formatClockTime(question.drawHour || 12, question.drawMinute || 0);
      const hands = question.clockTask === "draw"
        ? `
            <div class="clock-hand hour draggable" data-clock-hand="hour" style="transform: rotate(${drawHourRotation}deg)"></div>
            <div class="clock-hand minute draggable" data-clock-hand="minute" style="transform: rotate(${drawMinuteRotation}deg)"></div>
            <div class="clock-center"></div>
          `
        : `
            <div class="clock-hand hour" style="transform: rotate(${hourRotation}deg)"></div>
            <div class="clock-hand minute" style="transform: rotate(${minuteRotation}deg)"></div>
            <div class="clock-center"></div>
          `;

      return `
        <div class="clock-wrap">
          <div class="clock-face" data-clock-face="${question.clockTask}">
            ${ticks}
            ${numbers}
            ${hands}
          </div>
          <div class="clock-label" ${question.clockTask === "draw" ? 'data-clock-display="draw"' : ""}>${question.clockTask === "draw" ? drawTimeLabel : "__ : __"}</div>
          ${question.clockTask === "draw" ? '<div class="clock-help">拖動短針同長針</div>' : ""}
        </div>
      `;
    }

      const length = level === "challenge" ? 6 : 5;
      const isReverse = direction === "reverse";
      const start = isReverse
        ? Math.floor(Math.random() * (101 - length)) + length
        : Math.floor(Math.random() * (101 - length)) + 1;
      const hideIndex = level === "easy"
        ? Math.floor(Math.random() * 2) + 1
        : Math.floor(Math.random() * (length - 2)) + 1;
      const numbers = Array.from({ length }, (_, index) => start + (isReverse ? -index : index));
      const answer = numbers[hideIndex];
      const shown = numbers.map((value, index) => (index === hideIndex ? null : value));

      return {
        type: "sequence",
        theme,
        main,
        helper,
        activity,
        item: activity.item,
        direction,
        numbers,
        shown,
        answer

    function createNumberLogicQuestion() {
      const theme = pick(themes);
      const main = pick(family);
      const helper = pickHelper(main);
      const activity = pick(logicActivities);
      const stepChoices = [1, 2, 5, 10];
      const step = pick(stepChoices);
      const startMax = 100 - (step * 4);
      const start = Math.floor(Math.random() * startMax) + 1;
      const numbers = Array.from({ length: 5 }, (_, index) => start + (step * index));
      const hideIndex = 3;
      const answer = numbers[hideIndex];
      const shown = numbers.map((value, index) => (index === hideIndex ? null : value));

      return {
        type: "logic",
        logicKind: "number",
        theme,
        main,
        helper,
        activity,
        step,
        shown,
        answer
      };
    }

    function createShapeLogicQuestion() {
      const theme = pick(themes);
      const main = pick(family);
      const helper = pickHelper(main);
      const activity = pick(logicActivities);
      const shapePairs = [
        ["▲", "●"],
        ["◆", "■"],
        ["★", "●"],
        ["■", "▲"]
      ];
      const shapes = pick(shapePairs);
      const answer = shapes[0];
      const shown = [shapes[0], shapes[1], shapes[0], shapes[1], null];
      const distractors = ["▲", "●", "◆", "■", "★"].filter((shape) => shape !== answer);
      const options = [answer, ...distractors.sort(() => Math.random() - 0.5).slice(0, 2)]
        .sort(() => Math.random() - 0.5);

      return {
        type: "logic",
        logicKind: "shape",
        theme,
        main,
        helper,
        activity,
        shown,
        options,
        answer
      };
    }

    function createBlendingQuestion(level = "normal", usedWords = new Set()) {
      const levelWords = blendingWords.filter((item) => item.level === level);
      const basePool = levelWords.length ? levelWords : blendingWords;
      const freshPool = basePool.filter((item) => !usedWords.has(item.word));
      const target = pick(freshPool.length ? freshPool : basePool);
      usedWords.add(target.word);
      const pictureCount = level === "easy" ? 2 : 3;
      const blendCount = level === "easy" ? 3 : level === "challenge" ? 5 : 4;
      const picturePool = level === "challenge" ? blendingWords : levelWords;
      const blendPool = blendChoicesByLevel[level] || blendChoices;
      const pictureOptions = [target, ...picturePool
        .filter((item) => item.word !== target.word)
        .sort(() => Math.random() - 0.5)
        .slice(0, pictureCount - 1)]
        .sort(() => Math.random() - 0.5);
      const distractors = blendPool
        .filter((item) => item !== target.blend)
        .sort(() => Math.random() - 0.5)
        .slice(0, blendCount - 1);
      const blendOptions = [target.blend, ...distractors].sort(() => Math.random() - 0.5);
      const instruction = pick(blendingInstructions[level] || blendingInstructions.normal);

      return {
        type: "blending",
        theme: {
          label: "English Blending",
          stamp: "ABC"
        },
        pictureOptions,
        tail: target.tail,
        word: target.word,
        blendOptions,
        instruction,
        answer: target.blend
      };
    }

    function createChineseWritingQuestion(usedWords = new Set()) {
      const freshPool = chineseWritingWords.filter((item) => !usedWords.has(item.word));
      const target = pick(freshPool.length ? freshPool : chineseWritingWords);
      usedWords.add(target.word);

      return {
        type: "chineseWriting",
        theme: {
          label: "Chinese Writing",
          stamp: "字"
        },
        word: target.word,
        picture: target.picture,
        strokes: target.strokes,
        sentence: target.sentence,
        answer: target.word
      };
    }

    function pickDoubleDigitNumbers(isAdd, level) {
      const pools = {
        easy: [10, 20, 30, 40, 50, 60, 70, 80, 90],
        normal: [15, 25, 35, 45, 55, 65, 75, 85]
      };

      if (level === "easy" || level === "normal") {
        const pool = pools[level];
        let first = pick(pool);
        let second = pick(pool);
        while (isAdd ? first + second > 100 : second > first) {
          first = pick(pool);
          second = pick(pool);
        }
        return [first, second];
      }

      let first = Math.floor(Math.random() * 90) + 10;
      let second = Math.floor(Math.random() * 90) + 10;
      const isNoCarry = (a, b) => (a % 10) + (b % 10) < 10;
      const isNoBorrow = (a, b) => (a % 10) >= (b % 10);

      while (isAdd
        ? first + second > 100 || !isNoCarry(first, second)
        : second > first || !isNoBorrow(first, second)) {
        first = Math.floor(Math.random() * 90) + 10;
        second = Math.floor(Math.random() * 90) + 10;
      }

      return [first, second];
    }

    function createAddSubQuestion(forceMode = "mixed", level = "normal") {
      const theme = pick(themes);
      const main = pick(family);
      const helper = pickHelper(main);
      const activity = pick(addSubActivities);
      const tensMode = forceMode === "tensAdd" || forceMode === "tensSub";
      const isAdd = forceMode === "add" || forceMode === "tensAdd"
        ? true
        : forceMode === "sub" || forceMode === "tensSub"
          ? false
          : Math.random() > 0.45;
      let first;
      let second;

      if (tensMode) {
        [first, second] = pickDoubleDigitNumbers(isAdd, level);
      } else {
        first = Math.floor(Math.random() * 9) + 1;
        second = Math.floor(Math.random() * 9) + 1;
      }

      if (!tensMode) {
        if (isAdd) {
          while (first + second > 10) {
            first = Math.floor(Math.random() * 9) + 1;
            second = Math.floor(Math.random() * 9) + 1;
          }
        } else if (second > first) {
          [first, second] = [second, first];
        }
      }

      return {
        type: "addsub",
        theme,
        main,
        helper,
        activity,
        item: activity.item,
        first,
        second,
        isAdd,
        tensMode,
        operator: isAdd ? "+" : "-",
        answer: isAdd ? first + second : first - second
      };
    }

    function generateQuestions() {
      const mode = modeSelect.value;
      const count = Number(countSelect.value);
      const level = sequenceLevel.value;
      const usedBlendingWords = new Set();
      const usedChineseWritingWords = new Set();

      currentQuestions = Array.from({ length: count }, (_, index) => {
        let question;
        if (mode === "sequence") {
          question = createSequenceQuestion(level);
        } else if (mode === "reverseSequence") {
          question = createSequenceQuestion(level, "reverse");
        } else if (mode === "clock") {
          question = createClockQuestion();
        } else if (mode === "logic") {
          question = createLogicQuestion();
        } else if (mode === "add") {
          question = createAddSubQuestion("add");
        } else if (mode === "sub") {
          question = createAddSubQuestion("sub");
        } else if (mode === "tensAdd") {
          question = createAddSubQuestion("tensAdd", level);
        } else if (mode === "tensSub") {
          question = createAddSubQuestion("tensSub", level);
        } else if (mode === "blending") {
          question = createBlendingQuestion(level, usedBlendingWords);
        } else if (mode === "chineseWriting") {
          question = createChineseWritingQuestion(usedChineseWritingWords);
        } else {
          const builders = [
            () => createSequenceQuestion(level),
            () => createSequenceQuestion(level, "reverse"),
            () => createClockQuestion(),
            () => createLogicQuestion(),
            () => createAddSubQuestion("add"),
            () => createAddSubQuestion("sub"),
            () => createAddSubQuestion("tensAdd", level),
            () => createAddSubQuestion("tensSub", level),
            () => createBlendingQuestion(level, usedBlendingWords),
            () => createChineseWritingQuestion(usedChineseWritingWords)
          ];
          question = pick(builders)();
        }

        return {
          id: index + 1,
          ...question
        };
      });

      renderQuestions();
      scoreText.textContent = textPack().scoreReady;
      scoreSubtext.textContent = textPack().scoreReadySub(count);
      updateMissionSummary();
    }

    function renderQuestions() {
      if (!currentQuestions.length) {

      }

      questionsEl.innerHTML = currentQuestions.map((question) => {

        return `

            <div class="card-head">
              <div class="section-chip ${question.type}">${currentLanguage === "zh" ? `第 ${question.id} 題・${view.title}` : `Q${question.id} · ${view.title}`}</div>

            </div>

            <h3>${view.prompt}</h3>

              ? ""
              : `<p class="story">${question.type === "blending" || currentLanguage !== "zh" ? "Hint: " : "提示："}${view.clue}</p>`
            }

              ${renderBlending(question)}

              ${renderVisualMath(question)}

                : ""}
            </div>

            <div class="input-row">

                <input
                  class="answer"
                  type="${question.type === "clock" || question.type === "blending" ? "text" : "number"}"
                  inputmode="${question.type === "clock" || question.type === "blending" ? "text" : "numeric"}"
                  ${question.type === "clock" || question.type === "blending" ? "" : 'pattern="[0-9]*" min="0" max="100"'}
                  placeholder="${question.type === "clock" ? "" : textPack().answerPlaceholder}"
                  aria-label="${currentLanguage === "zh" ? `第 ${question.id} 題答案` : `Answer for question ${question.id}`}"

      requestAnimationFrame(() => {

    function normalizeClockAnswer(value) {
      const match = String(value).trim().match(/^(\d{1,2})\s*[:：]\s*(\d{1,2})$/);
      if (!match) {
        return "";
      }

      return `${Number(match[1])}:${String(Number(match[2])).padStart(2, "0")}`;
    }

    function formatClockTime(hour, minute) {
      return `${hour || 12}:${String(minute || 0).padStart(2, "0")}`;
    }

    function angleFromPointer(event, face) {
      const box = face.getBoundingClientRect();
      const centerX = box.left + box.width / 2;
      const centerY = box.top + box.height / 2;
      const radians = Math.atan2(event.clientY - centerY, event.clientX - centerX);
      return (radians * 180 / Math.PI + 90 + 360) % 360;
    }

    function updateClockHand(hand, event) {
      const card = hand.closest(".card");
      const face = hand.closest(".clock-face");
      const question = currentQuestions.find((item) => item.id === Number(card.dataset.id));
      if (!question) {
        return;
      }

      const rawAngle = angleFromPointer(event, face);
      const handType = hand.dataset.clockHand;
      const snap = handType === "minute" ? 30 : 30;
      const angle = Math.round(rawAngle / snap) * snap % 360;
      hand.style.transform = `rotate(${angle}deg)`;

      if (handType === "minute") {
        question.drawMinute = angle === 360 ? 0 : angle / 6;
      } else {
        const hour = angle === 0 ? 12 : angle / 30;
        question.drawHour = hour;
      }

      const display = card.querySelector("[data-clock-display]");
      if (display) {
        display.textContent = formatClockTime(question.drawHour || 12, question.drawMinute || 0);
      }

      checkDrawClockNow(card, question);
    }

    function checkDrawClockNow(card, question) {
      if (question.type !== "clock" || question.clockTask !== "draw") {
        return;
      }

      const feedback = card.querySelector(".feedback");
      if (!feedback) {
        return;
      }

      const isCorrect = question.drawHour === question.hour && question.drawMinute === question.minute;
      feedback.classList.remove("good", "bad");
      card.classList.toggle("done", isCorrect);
      if (isCorrect) {
        feedback.classList.add("good");
        feedback.textContent = currentLanguage === "zh" ? "答啱喇，好叻！" : "Correct. Great job.";
      } else {
        feedback.textContent = "";
      }
    }

    function checkBlendingNow(card) {
      const question = currentQuestions.find((item) => item.id === Number(card.dataset.id));
      if (!question || question.type !== "blending") {
        return;
      }

      const input = card.querySelector(".answer");
      const feedback = card.querySelector(".feedback");
      const selectedPicture = card.querySelector(".blend-picture.selected");
      const blendChoices = Array.from(card.querySelectorAll(".blend-choice"));
      const pictureChoices = Array.from(card.querySelectorAll(".blend-picture"));
      const value = input?.value.trim().toLowerCase() || "";
      const pictureIsCorrect = selectedPicture?.dataset.blendPicture === question.word;
      const wordIsCorrect = value === question.answer;

      pictureChoices.forEach((choice) => choice.classList.remove("correct", "wrong"));
      blendChoices.forEach((choice) => choice.classList.remove("correct", "wrong"));
      input?.classList.remove("correct", "wrong");
      feedback.classList.remove("good", "bad");
      card.classList.toggle("done", pictureIsCorrect && wordIsCorrect);

      if (pictureIsCorrect && wordIsCorrect) {
        selectedPicture.classList.add("correct");
        blendChoices
          .filter((choice) => choice.dataset.blendChoice === question.answer)
          .forEach((choice) => choice.classList.add("correct"));
        input.classList.add("correct");
        feedback.classList.add("good");
        feedback.textContent = "Correct. Great blending!";
      } else {
        feedback.textContent = "";
      }
    }

    function updateBlendPattern(card, value) {
      const slots = Array.from(card.querySelectorAll("[data-blend-slot]"));
      const letters = String(value || "").trim().toLowerCase().slice(0, slots.length).split("");
      slots.forEach((slot, index) => {
        const letter = letters[index] || "";
        slot.textContent = letter;
        slot.classList.toggle("blend-fill", Boolean(letter));
        slot.classList.toggle("blend-blank", !letter);
      });
    }

    async function checkAnswers(showAnswers) {
      if (!currentQuestions.length) {
        scoreText.textContent = textPack().scoreEmpty;
        scoreSubtext.textContent = textPack().scoreNeedGenerate;
        return;
      }

      const cards = Array.from(document.querySelectorAll(".card"));
      let correctCount = 0;
      let gradableCount = 0;
      let drawingCount = 0;
      const writingScores = [];

      for (const [index, card] of cards.entries()) {
        const input = card.querySelector(".answer");
        const feedback = card.querySelector(".feedback");
        const question = currentQuestions[index];
        const view = formatQuestion(question);
        card.classList.remove("done");

        if (question.type === "logic" && question.logicKind === "shape") {
          gradableCount += 1;
          const choices = Array.from(card.querySelectorAll(".shape-choice"));
          let selected = card.querySelector(".shape-choice.selected");

          choices.forEach((choice) => choice.classList.remove("correct", "wrong"));
          feedback.classList.remove("good", "bad");

          if (showAnswers) {
            selected = choices.find((choice) => choice.dataset.shapeChoice === question.answer);
            selected.classList.add("selected");
          }

          if (!selected) {
            feedback.classList.add("bad");
            feedback.textContent = textPack().missingAnswer(view.clue);
          } else if (selected.dataset.shapeChoice === question.answer) {
            correctCount += 1;
            card.classList.add("done");
            selected.classList.add("correct");
            feedback.classList.add("good");
            feedback.textContent = pick(textPack().praiseGood);
          } else {
            selected.classList.add("wrong");
            feedback.classList.add("bad");
            feedback.textContent = textPack().wrongAnswer(pick(textPack().praiseTry), question.answer);
          }
          continue;
        }

        if (question.type === "blending") {
          gradableCount += 1;
          const pictureChoices = Array.from(card.querySelectorAll(".blend-picture"));
          const selectedPicture = card.querySelector(".blend-picture.selected");
          const value = input ? input.value.trim().toLowerCase() : "";
          const pictureIsCorrect = selectedPicture?.dataset.blendPicture === question.word;
          const wordIsCorrect = value === question.answer;

          pictureChoices.forEach((choice) => choice.classList.remove("correct", "wrong"));
          if (showAnswers) {
            const targetPicture = pictureChoices.find((choice) => choice.dataset.blendPicture === question.word);
            if (targetPicture) {
              targetPicture.classList.add("selected", "correct");
            }
            input.value = question.answer;
            updateBlendPattern(card, question.answer);
          }

          input.classList.remove("correct", "wrong");
          feedback.classList.remove("good", "bad");

          if (pictureIsCorrect && wordIsCorrect) {
            correctCount += 1;
            card.classList.add("done");
            selectedPicture.classList.add("correct");
            input.classList.add("correct");
            feedback.classList.add("good");
            feedback.textContent = pick(textPack().praiseGood);
          } else if (!selectedPicture || value === "") {
            feedback.classList.add("bad");
            feedback.textContent = "Choose the picture and fill in the blend.";
          } else {
            selectedPicture.classList.add(pictureIsCorrect ? "correct" : "wrong");
            input.classList.add(wordIsCorrect ? "correct" : "wrong");
            feedback.classList.add("bad");
            feedback.textContent = textPack().wrongAnswer(pick(textPack().praiseTry));
          }
          continue;
        }

        if (question.type === "chineseWriting") {
          drawingCount += 1;
          cancelWritingAutoCheck(card);
          const writingScore = await scoreWritingCard(card, question);
          if (writingScore.hasWriting) {
            writingScores.push(writingScore.total);
          }
          continue;
        }

        if (!input && question.type === "clock" && question.clockTask === "draw") {
          gradableCount += 1;
          const hourHand = card.querySelector('[data-clock-hand="hour"]');
          const minuteHand = card.querySelector('[data-clock-hand="minute"]');
          const targetHour = question.hour;
          const targetMinute = question.minute;

          if (showAnswers) {
            question.drawHour = targetHour;
            question.drawMinute = targetMinute;
            if (hourHand) {
              hourHand.style.transform = `rotate(${(targetHour % 12) * 30}deg)`;
            }
            if (minuteHand) {
              minuteHand.style.transform = `rotate(${targetMinute * 6}deg)`;
            }
            const display = card.querySelector("[data-clock-display]");
            if (display) {
              display.textContent = formatClockTime(targetHour, targetMinute);
            }
          }

          const hasMovedHands = question.drawHour !== undefined || question.drawMinute !== undefined;
          const isCorrect = question.drawHour === targetHour && question.drawMinute === targetMinute;
          feedback.classList.remove("good", "bad");

          if (isCorrect) {
            correctCount += 1;
            card.classList.add("done");
            feedback.classList.add("good");
            feedback.textContent = pick(textPack().praiseGood);
          } else if (!hasMovedHands) {
            feedback.classList.add("bad");
            feedback.textContent = currentLanguage === "zh"
              ? "請拖動短針同長針。"
              : "Move the hour hand and the minute hand.";
          } else {
            feedback.classList.add("bad");
            feedback.textContent = textPack().wrongAnswer(pick(textPack().praiseTry));
          }
          return;
        }

        if (!input) {
          drawingCount += 1;
          feedback.classList.remove("good", "bad");
          feedback.textContent = currentLanguage === "zh"
            ? "請直接喺鐘面畫出指針。"
            : "Draw the hands directly on the clock face.";
          return;
        }

        gradableCount += 1;

        if (showAnswers) {
          input.value = question.answer;
        }

        const value = question.type === "clock"
          ? normalizeClockAnswer(input.value)
          : question.type === "blending"
            ? input.value.trim().toUpperCase()
            : Number(input.value);
        const isCorrect = input.value !== "" && value === question.answer;

        input.classList.remove("correct", "wrong");
        feedback.classList.remove("good", "bad");

        if (isCorrect) {
          correctCount += 1;
          card.classList.add("done");
          input.classList.add("correct");
          feedback.classList.add("good");
          feedback.textContent = pick(textPack().praiseGood);
        } else if (input.value === "") {
          feedback.classList.add("bad");
          feedback.textContent = textPack().missingAnswer(view.clue);
        } else {
          input.classList.add("wrong");
          feedback.classList.add("bad");
          feedback.textContent = textPack().wrongAnswer(pick(textPack().praiseTry), question.answer);
        }
      }

      const averageWritingScore = writingScores.length
        ? Math.round(writingScores.reduce((sum, value) => sum + value, 0) / writingScores.length)
        : 0;

      if (drawingCount > 0 && gradableCount > 0) {
        scoreText.textContent = currentLanguage === "zh"
          ? `${correctCount} / ${gradableCount} 題答啱・寫字平均 ${averageWritingScore} 分`
          : `${correctCount} / ${gradableCount} correct · Writing average ${averageWritingScore}`;
      } else if (drawingCount > 0) {
        scoreText.textContent = currentLanguage === "zh"
          ? `寫字平均 ${averageWritingScore} 分`
          : `Writing average ${averageWritingScore}`;
      } else if (correctCount === gradableCount) {
        scoreText.textContent = textPack().summaryLine(correctCount, currentQuestions.length);
      } else {
        scoreText.textContent = textPack().summaryLine(correctCount, currentQuestions.length);
      }

      if (drawingCount > 0 && gradableCount === 0) {
        scoreSubtext.textContent = currentLanguage === "zh"
          ? averageWritingScore >= 85
            ? "寫得好靚，筆順同位置都做得唔錯。"
            : averageWritingScore >= 65
              ? "好叻呀，再慢慢跟筆順，字會更穩陣。"
              : "唔緊要，跟住上面筆順再寫一次。"
          : averageWritingScore >= 85
            ? "Great writing. Stroke order and position look strong."
            : averageWritingScore >= 65
              ? "Nice work. Follow the stroke order slowly for an even better shape."
              : "Keep going. Try once more with the stroke guide above.";
      } else if (gradableCount === 0) {
        scoreSubtext.textContent = currentLanguage === "zh"
          ? "完成後可以一齊對照時間檢查指針。"
          : "Check the clock hands together when finished.";
      } else if (correctCount === gradableCount) {
        scoreSubtext.textContent = textPack().summaryPerfect;
      } else if (correctCount >= Math.ceil(gradableCount * 0.6)) {
        scoreSubtext.textContent = textPack().summaryGood;
      } else {
        scoreSubtext.textContent = textPack().summaryTry;
      }
    }

    function speakQuestionById(id) {
      if (soundToggle.value === "off" || !("speechSynthesis" in window)) {
        return;
      }

      const question = currentQuestions.find((item) => item.id === Number(id));
      if (!question) {
        return;
      }

      const view = formatQuestion(question);
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(view.speech);
      utterance.lang = currentLanguage === "zh" ? "zh-HK" : "en-US";
      utterance.rate = 0.92;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    function speakBlendChoice(blend) {
      if (soundToggle.value === "off" || !("speechSynthesis" in window) || !blend) {
        return;
      }

      const speech = blendSpeechGuide[String(blend).toLowerCase()] || String(blend);
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(speech);
      utterance.lang = "en-US";
      utterance.rate = 0.78;
      utterance.pitch = 1.02;
      window.speechSynthesis.speak(utterance);
    }

    const hanziCharacterCache = new Map();

    function getHanziCharacterData(word) {
      if (!window.HanziWriter?.loadCharacterData || !word) {
        return Promise.resolve(null);
      }

      if (!hanziCharacterCache.has(word)) {
        hanziCharacterCache.set(
          word,
          window.HanziWriter.loadCharacterData(word).catch(() => null)
        );
      }

      return hanziCharacterCache.get(word);
    }

    function buildWritingDemoSvg(charData, strokeNumbers, showComplete, showDirections = true) {
      const svgSize = 100;
      const transformInfo = window.HanziWriter?.getScalingTransform
        ? window.HanziWriter.getScalingTransform(svgSize, svgSize, 8)
        : null;
      const transform = typeof transformInfo === "string"
        ? transformInfo
        : (transformInfo?.transform || "");
      const highlighted = new Set(strokeNumbers);
      const paths = charData.strokes.map((path, index) => {
        const strokeNumber = index + 1;
        const active = showComplete || highlighted.has(strokeNumber);
        const fill = active ? "#4b4179" : "#d8d1f3";
        const opacity = active ? "1" : "0.32";
        return `<path d="${path}" fill="${fill}" opacity="${opacity}"></path>`;
      }).join("");
      const directionLines = (charData.medians || []).map((median, index) => {
        const strokeNumber = index + 1;
        const active = showComplete || highlighted.has(strokeNumber);
        if (!active || !showDirections || !Array.isArray(median) || median.length < 2) {
          return "";
        }

        const points = median.map((point) => `${point[0]},${point[1]}`).join(" ");
        const startPoint = median[0];
        const middleIndex = Math.max(0, Math.floor(median.length / 2) - 1);
        const middlePoint = median[middleIndex] || median[0];
        const nextPoint = median[Math.min(median.length - 1, middleIndex + 1)] || median[median.length - 1];
        const angle = Math.atan2(nextPoint[1] - middlePoint[1], nextPoint[0] - middlePoint[0]) * 180 / Math.PI;
        return `
          <circle cx="${startPoint[0]}" cy="${startPoint[1]}" r="6.8" fill="#ffffff" opacity="0.98"></circle>
          <circle cx="${startPoint[0]}" cy="${startPoint[1]}" r="5.2" fill="#ff2d2d" opacity="1"></circle>
          <polyline points="${points}" fill="none" stroke="#ffffff" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.98"></polyline>
          <polyline points="${points}" fill="none" stroke="#ff2d2d" stroke-width="8.4" stroke-linecap="round" stroke-linejoin="round" opacity="1"></polyline>
          <path d="M-16,-10 L0,0 L-16,10 Q-10,0 -16,-10 Z" fill="#ff2d2d" opacity="1" transform="translate(${middlePoint[0]} ${middlePoint[1]}) rotate(${angle})"></path>
        `;
      }).join("");

      return `
        <svg class="writing-word-svg" viewBox="0 0 ${svgSize} ${svgSize}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
          <g transform="${transform}">${paths}${directionLines}</g>
        </svg>
      `;
    }

    async function updateWritingGlyph(glyph) {

      const strokeNumbers = (glyph.dataset.writingStrokes || "")

      const showComplete = glyph.dataset.writingComplete === "1";
      const showDirections = glyph.dataset.writingDirections !== "0";
      const charData = await getHanziCharacterData(word);
      if (!charData) {

        return;

      glyph.innerHTML = buildWritingDemoSvg(charData, strokeNumbers, showComplete, showDirections);

    function activateWritingStep(stepButton) {

    async function playWritingSteps(playTrigger) {

    const writingCanvasState = new WeakMap();

    function getWritingState(canvas) {
      if (!canvas) {
        return null;
      }

      if (!writingCanvasState.has(canvas)) {
        writingCanvasState.set(canvas, {
          strokes: [],
          currentStroke: null
        });
      }

      return writingCanvasState.get(canvas);
    }

    function clonePoints(points) {
      return points.map((point) => ({ x: point.x, y: point.y }));
    }

    function flattenStrokePoints(strokes) {
      return strokes.flatMap((stroke) => stroke.points || []);
    }

    function computeBounds(points) {
      if (!points.length) {
        return null;
      }

      let minX = points[0].x;
      let maxX = points[0].x;
      let minY = points[0].y;
      let maxY = points[0].y;

      points.forEach((point) => {
        minX = Math.min(minX, point.x);
        maxX = Math.max(maxX, point.x);
        minY = Math.min(minY, point.y);
        maxY = Math.max(maxY, point.y);
      });

      return {
        minX,
        maxX,
        minY,
        maxY,
        width: Math.max(maxX - minX, 0.0001),
        height: Math.max(maxY - minY, 0.0001),
        centerX: (minX + maxX) / 2,
        centerY: (minY + maxY) / 2
      };
    }

    function normalizeStrokePoints(points, bounds) {
      const scale = Math.max(bounds?.width || 1, bounds?.height || 1, 0.0001);
      const offsetX = ((bounds?.width || 0) / scale - 1) / 2;
      const offsetY = ((bounds?.height || 0) / scale - 1) / 2;

      return points.map((point) => ({
        x: (point.x - bounds.minX) / scale - offsetX,
        y: (point.y - bounds.minY) / scale - offsetY
      }));
    }

    function pathLength(points) {
      let total = 0;
      for (let index = 1; index < points.length; index += 1) {
        total += Math.hypot(points[index].x - points[index - 1].x, points[index].y - points[index - 1].y);
      }
      return total;
    }

    function resampleStroke(points, sampleCount = 18) {
      if (!points.length) {
        return [];
      }

      if (points.length === 1) {
        return Array.from({ length: sampleCount }, () => ({ ...points[0] }));
      }

      const total = pathLength(points);
      if (!total) {
        return Array.from({ length: sampleCount }, () => ({ ...points[0] }));
      }

      const cumulative = [0];
      for (let index = 1; index < points.length; index += 1) {
        cumulative.push(cumulative[index - 1] + Math.hypot(points[index].x - points[index - 1].x, points[index].y - points[index - 1].y));
      }

      const step = total / (sampleCount - 1);
      const samples = [];

      for (let sampleIndex = 0; sampleIndex < sampleCount; sampleIndex += 1) {
        const target = sampleIndex * step;
        let pointIndex = cumulative.findIndex((value) => value >= target);
        if (pointIndex <= 0) {
          samples.push({ ...points[0] });
          continue;
        }

        if (pointIndex === -1) {
          samples.push({ ...points[points.length - 1] });
          continue;
        }

        const previousDistance = cumulative[pointIndex - 1];
        const nextDistance = cumulative[pointIndex];
        const segmentSpan = Math.max(nextDistance - previousDistance, 0.0001);
        const ratio = (target - previousDistance) / segmentSpan;
        const previousPoint = points[pointIndex - 1];
        const nextPoint = points[pointIndex];
        samples.push({
          x: previousPoint.x + (nextPoint.x - previousPoint.x) * ratio,
          y: previousPoint.y + (nextPoint.y - previousPoint.y) * ratio
        });
      }

      return samples;
    }

    function compareStrokeShapes(userStroke, templateStroke) {
      const sampleCount = 18;
      const userSamples = resampleStroke(userStroke, sampleCount);
      const templateSamples = resampleStroke(templateStroke, sampleCount);

      if (!userSamples.length || !templateSamples.length) {
        return 0;
      }

      let totalDistance = 0;
      for (let index = 0; index < sampleCount; index += 1) {
        totalDistance += Math.hypot(userSamples[index].x - templateSamples[index].x, userSamples[index].y - templateSamples[index].y);
      }

      const averageDistance = totalDistance / sampleCount;
      return Math.max(0, 1 - averageDistance / 0.42);
    }

    function getWritingTemplateStrokes(charData) {
      if (!charData?.medians?.length) {
        return [];
      }

      const templatePoints = charData.medians.flatMap((median) => (median || []).map((point) => ({
        x: point[0],
        y: point[1]
      })));
      const templateBounds = computeBounds(templatePoints);
      if (!templateBounds) {
        return [];
      }

      return charData.medians.map((median) => normalizeStrokePoints((median || []).map((point) => ({
        x: point[0],
        y: point[1]
      })), templateBounds));
    }

    function getWritingCanvasStrokes(canvas) {
      const state = getWritingState(canvas);
      return state?.strokes || [];
    }

    function scoreWritingAspect(kind, value) {
      const zh = {
        order: ["跟得好準", "大致啱", "次序有少少亂", "筆順未跟到"],
        size: ["大小適中", "差唔多", "可再寫穩少少", "太大或太細"],
        position: ["位置非常好", "位置唔錯", "可再放中間啲", "位置偏咗"],
        count: ["筆劃數正確", "差一點點", "筆劃數唔穩", "筆劃數唔啱"]
      };
      const en = {
        order: ["Stroke order is strong", "Mostly right", "Order is a little mixed", "Stroke order is off"],
        size: ["Size is just right", "Almost right", "Needs steadier size", "Too big or too small"],
        position: ["Position is very good", "Position looks good", "Try placing it more in the middle", "Position is off"],
        count: ["Stroke count is right", "Very close", "Stroke count is not stable", "Stroke count is wrong"]
      };
      const pack = currentLanguage === "zh" ? zh : en;
      const labels = pack[kind] || pack.order;
      if (value >= 88) {
        return labels[0];
      }
      if (value >= 72) {
        return labels[1];
      }
      if (value >= 55) {
        return labels[2];
      }
      return labels[3];
    }

    function scoreWritingStars(value) {
      if (value >= 90) {
        return "🌟🌟🌟🌟🌟";
      }
      if (value >= 78) {
        return "🌟🌟🌟🌟";
      }
      if (value >= 62) {
        return "🌟🌟🌟";
      }
      if (value >= 46) {
        return "🌟🌟";
      }
      return "🌟";
    }

    function buildWritingFeedbackHtml(score) {
      if (!score.hasWriting) {
        return currentLanguage === "zh"
          ? "未開始寫字呀，先喺下面大格寫一次。"
          : "Not written yet. Try writing once in the big box first.";
      }

      const summary = currentLanguage === "zh"
        ? `寫字評分 ${score.total} 分 ${scoreWritingStars(score.total)}`
        : `Writing score ${score.total} ${scoreWritingStars(score.total)}`;
      const orderLabel = currentLanguage === "zh" ? "筆順" : "Stroke order";
      const sizeLabel = currentLanguage === "zh" ? "大小" : "Size";
      const positionLabel = currentLanguage === "zh" ? "位置" : "Position";
      const countLabel = currentLanguage === "zh" ? "筆劃數" : "Stroke count";

      return `
        <span class="writing-score-summary">${summary}</span>
        <span class="writing-score-detail">${orderLabel}：${scoreWritingAspect("order", score.order)}</span>
        <span class="writing-score-detail">${sizeLabel}：${scoreWritingAspect("size", score.size)}</span>
        <span class="writing-score-detail">${positionLabel}：${scoreWritingAspect("position", score.position)}</span>
        <span class="writing-score-detail">${countLabel}：${scoreWritingAspect("count", score.count)}</span>
      `;
    }

    const writingAutoCheckTimers = new WeakMap();

    async function scoreWritingCard(card, question) {
      const feedback = card?.querySelector(".feedback");
      const canvas = card?.querySelector(".writing-canvas");
      if (!feedback || !canvas) {
        return {
          hasWriting: false,
          total: 0,
          order: 0,
          size: 0,
          position: 0,
          count: 0
        };
      }

      const writingScore = await evaluateWritingQuestion(question, canvas);
      feedback.classList.remove("good", "bad");
      feedback.innerHTML = buildWritingFeedbackHtml(writingScore);

      if (writingScore.hasWriting) {
        card.classList.add("done");
        feedback.classList.add(
          writingScore.total >= 68 && writingScore.order >= 60 && writingScore.count >= 60
            ? "good"
            : "bad"
        );
      } else {
        card.classList.remove("done");
        feedback.classList.add("bad");
      }

      return writingScore;
    }

    function cancelWritingAutoCheck(card) {
      const timer = writingAutoCheckTimers.get(card);
      if (timer) {
        window.clearTimeout(timer);
        writingAutoCheckTimers.delete(card);
      }
    }

    function scheduleWritingAutoCheck(card) {
      const question = currentQuestions.find((item) => item.id === Number(card?.dataset.id));
      if (!card || !question || question.type !== "chineseWriting") {
        return;
      }

      cancelWritingAutoCheck(card);
      const timer = window.setTimeout(() => {
        writingAutoCheckTimers.delete(card);
        void scoreWritingCard(card, question);
      }, 5000);
      writingAutoCheckTimers.set(card, timer);
    }

    async function evaluateWritingQuestion(question, canvas) {
      const drawnStrokes = getWritingCanvasStrokes(canvas)
        .filter((stroke) => Array.isArray(stroke.points) && stroke.points.length >= 2);
      const allPoints = flattenStrokePoints(drawnStrokes);
      const drawingBounds = computeBounds(allPoints);
      const expectedStrokeCount = question.strokes.length;

      if (!drawnStrokes.length || !drawingBounds) {
        return {
          hasWriting: false,
          total: 0,
          order: 0,
          size: 0,
          position: 0,
          count: 0
        };
      }

      const normalizedUserStrokes = drawnStrokes.map((stroke) => ({
        points: normalizeStrokePoints(stroke.points, drawingBounds)
      }));

      const charData = await getHanziCharacterData(question.word);
      const templateStrokes = getWritingTemplateStrokes(charData);

      let orderScore = 0;
      if (templateStrokes.length) {
        const compareCount = Math.min(normalizedUserStrokes.length, templateStrokes.length);
        let orderTotal = 0;
        for (let index = 0; index < compareCount; index += 1) {
          orderTotal += compareStrokeShapes(normalizedUserStrokes[index].points, templateStrokes[index]);
        }
        orderScore = compareCount ? (orderTotal / compareCount) * 100 : 0;
      } else {
        const countGap = Math.abs(normalizedUserStrokes.length - expectedStrokeCount);
        orderScore = Math.max(0, 100 - countGap * 18);
      }

      const countGap = Math.abs(drawnStrokes.length - expectedStrokeCount);
      const countScore = countGap === 0 ? 100 : countGap === 1 ? 55 : 20;
      if (countGap >= 1) {
        orderScore *= 0.82;
      }

      const widthRatio = drawingBounds.width;
      const heightRatio = drawingBounds.height;
      const areaRatio = widthRatio * heightRatio;
      const idealWidth = 0.6;
      const idealHeight = 0.6;
      const widthFit = Math.max(0, 1 - Math.abs(widthRatio - idealWidth) / 0.22);
      const heightFit = Math.max(0, 1 - Math.abs(heightRatio - idealHeight) / 0.22);
      const areaFit = Math.max(0, 1 - Math.abs(areaRatio - 0.34) / 0.2);
      let sizeScore = Math.round((widthFit * 0.35 + heightFit * 0.35 + areaFit * 0.3) * 100);
      if (widthRatio < 0.3 || heightRatio < 0.3 || areaRatio < 0.14) {
        sizeScore = Math.min(sizeScore, 42);
      }

      const centerDistance = Math.hypot(drawingBounds.centerX - 0.5, drawingBounds.centerY - 0.5);
      let positionScore = Math.round(Math.max(0, 1 - centerDistance / 0.2) * 100);
      if (Math.abs(drawingBounds.centerX - 0.5) > 0.16 || Math.abs(drawingBounds.centerY - 0.5) > 0.16) {
        positionScore = Math.min(positionScore, 45);
      }

      let total = Math.round(
        orderScore * 0.42
        + countScore * 0.2
        + sizeScore * 0.23
        + positionScore * 0.15
      );

      if (orderScore < 45) {
        total = Math.min(total, 49);
      } else if (orderScore < 60) {
        total = Math.min(total, 64);
      }
      if (sizeScore < 45) {
        total = Math.min(total, 58);
      }
      if (positionScore < 45) {
        total = Math.min(total, 58);
      }

      return {
        hasWriting: true,
        total,
        order: Math.round(orderScore),
        size: sizeScore,
        position: positionScore,
        count: Math.round(countScore)
      };
    }

    function setupWritingStrokeDemos() {
      questionsEl.querySelectorAll(".writing-word-glyph").forEach(async (glyph) => {

    function clearWritingCanvas(canvas) {
      if (!canvas) {
        return;
      }

      const state = getWritingState(canvas);
      if (state) {
        state.strokes = [];
        state.currentStroke = null;
      }

      const context = canvas.getContext("2d");
      if (!context) {
        return;
      }

      context.save();
      context.setTransform(1, 0, 0, 1, 0, 0);
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.restore();
    }

    function resizeWritingCanvas(canvas) {
      if (!canvas) {
        return;
      }

      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) {
        return;
      }

      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);

      const context = canvas.getContext("2d");
      if (!context) {
        return;
      }

      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.lineCap = "round";
      context.lineJoin = "round";
      context.strokeStyle = "#574a8f";
      context.lineWidth = 6;
      clearWritingCanvas(canvas);
    }

    function setupWritingCanvases() {
      questionsEl.querySelectorAll(".writing-canvas").forEach((canvas) => {
        if (canvas.dataset.ready === "1") {
          return;
        }

        canvas.dataset.ready = "1";
        resizeWritingCanvas(canvas);
        const card = canvas.closest(".card");

        let drawing = false;
        let activePointerId = null;
        const state = getWritingState(canvas);

        const getLocalPoint = (event) => {
          const rect = canvas.getBoundingClientRect();
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;
          const inside = x >= 0 && y >= 0 && x <= rect.width && y <= rect.height;
          return { rect, x, y, inside };
        };

        const drawPoint = (event) => {
          const context = canvas.getContext("2d");
          const point = getLocalPoint(event);
          if (!context || !point.rect.width || !point.rect.height || !point.inside) {
            return;
          }

          if (!drawing) {
            context.beginPath();
            context.moveTo(point.x, point.y);
            drawing = true;
            state.currentStroke = [{
              x: point.x / point.rect.width,
              y: point.y / point.rect.height
            }];
            return;
          }

          context.lineTo(point.x, point.y);
          context.stroke();
          state.currentStroke?.push({
            x: point.x / point.rect.width,
            y: point.y / point.rect.height
          });
        };

        canvas.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          cancelWritingAutoCheck(card);
          activePointerId = event.pointerId;
          drawing = false;
          drawPoint(event);
        });

        canvas.addEventListener("pointermove", (event) => {
          if (event.pointerId !== activePointerId) {
            return;
          }
          const point = getLocalPoint(event);
          if (!point.inside) {
            drawing = false;
            return;
          }
          drawPoint(event);
        });

        const finishDrawing = (event) => {
          if (event.pointerId !== activePointerId) {
            return;
          }
          if (state.currentStroke?.length) {
            state.strokes.push({
              points: clonePoints(state.currentStroke)
            });
          }
          state.currentStroke = null;
          drawing = false;
          activePointerId = null;
          scheduleWritingAutoCheck(card);
        };

        canvas.addEventListener("pointerup", finishDrawing);
        canvas.addEventListener("pointercancel", finishDrawing);
        canvas.addEventListener("pointerleave", () => {
          state.currentStroke = null;
          drawing = false;
          activePointerId = null;
        });
      });
    }

        checkBlendingNow(card);
        return;
      }

      const blendChoice = event.target.closest("[data-blend-choice]");
      if (blendChoice) {
        const card = blendChoice.closest(".card");
        const input = card.querySelector(".answer");
        card.querySelectorAll(".blend-choice").forEach((choice) => choice.classList.remove("selected"));
        blendChoice.classList.add("selected");
        speakBlendChoice(blendChoice.dataset.blendChoice);
        if (input) {
          input.value = blendChoice.dataset.blendChoice;
          updateBlendPattern(card, input.value);
        }
        checkBlendingNow(card);
        return;
      }

      const shapeChoice = event.target.closest("[data-shape-choice]");
      if (shapeChoice) {
        shapeChoice.closest(".shape-options").querySelectorAll(".shape-choice").forEach((choice) => {
          choice.classList.remove("selected", "correct", "wrong");
        });
        shapeChoice.classList.add("selected");
        return;
      }

      const writingStep = event.target.closest("[data-writing-step]");
      if (writingStep) {
        activateWritingStep(writingStep);
        return;
      }

      const writingPlay = event.target.closest("[data-writing-play]");
      if (writingPlay) {
        void playWritingSteps(writingPlay);
        return;
      }

      const clearWriting = event.target.closest("[data-clear-writing]");
      if (clearWriting) {
        const card = clearWriting.closest(".card");
        cancelWritingAutoCheck(card);
        clearWritingCanvas(card?.querySelector(".writing-canvas"));
        const feedback = card?.querySelector(".feedback");
        if (feedback) {
          feedback.classList.remove("good", "bad");
          feedback.textContent = "";
        }
        card?.classList.remove("done");
        return;
      }

      const trigger = event.target.closest("[data-speak]");
      if (!trigger) {
        return;
      }
      speakQuestionById(trigger.dataset.speak);
    });

    questionsEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        void checkAnswers(false);
      }
    });

    questionsEl.addEventListener("input", (event) => {
      const input = event.target.closest(".answer");
      const card = input?.closest(".card.blending");
      if (card) {
        updateBlendPattern(card, input.value);
        checkBlendingNow(card);
      }
    });

    applyLanguage();
    scoreText.textContent = textPack().scoreStart;
    scoreSubtext.textContent = textPack().scoreNeedGenerate;
    missionText.textContent = textPack().missionDefault;
    missionSubtext.textContent = textPack().missionSubtext;
    generateQuestions();
  </script>
</body>
</html>
