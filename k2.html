<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jadon 每日一練</title>
  <style>
    :root {
      --paper: #fbf9ff;
      --paper-line: #e8e1ff;
      --page-border: #b7a8ef;
      --ink: #403764;
      --muted: #706890;
      --purple: #9b84e8;
      --purple-deep: #7a63d9;
      --blue: #7fb6ff;
      --yellow: #ffd96a;
      --pink: #ffbfdc;
      --mint: #bfeecf;
      --peach: #ffd4b2;
      --white: #ffffff;
      --shadow: 0 16px 40px rgba(79, 62, 136, 0.16);
      --dash: 2px dashed #b9b0e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(var(--paper-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line) 1px, transparent 1px),
        linear-gradient(180deg, #f4f0ff, #ecf6ff);
      background-size: 28px 28px, 28px 28px, 100% 100%;
      padding: 14px;
    }

    .fun-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .floating-sticker {
      position: absolute;
      filter: drop-shadow(0 10px 12px rgba(79, 62, 136, 0.18));
      opacity: 0.78;
      animation: floatSticker 6s ease-in-out infinite;
    }

    .floating-sticker.hero {
      top: 8%;
      left: 3%;
      font-size: 3rem;
    }

    .floating-sticker.fire {
      top: 18%;
      right: 4%;
      font-size: 3.2rem;
      animation-delay: -1.4s;
    }

    .floating-sticker.pyramid {
      bottom: 12%;
      left: 4%;
      font-size: 3.5rem;
      animation-delay: -2.2s;
    }

    .floating-sticker.sparkle {
      right: 6%;
      bottom: 8%;
      font-size: 3rem;
      animation-delay: -3s;
    }

    @keyframes floatSticker {
      0%, 100% {
        transform: translateY(0) rotate(-4deg) scale(1);
      }
      50% {
        transform: translateY(-18px) rotate(5deg) scale(1.08);
      }
    }

    .sheet {
      width: min(1120px, 100%);
      margin: 0 auto;
      background: var(--paper);
      border: 4px solid var(--page-border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 18px;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .sheet::before,
    .sheet::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      opacity: 0.16;
      pointer-events: none;
    }

    .sheet::before {
      top: -30px;
      right: -20px;
      background: radial-gradient(circle, #a8cfff 0%, rgba(168, 207, 255, 0) 72%);
    }

    .sheet::after {
      bottom: -30px;
      left: -20px;
      background: radial-gradient(circle, #ffc4db 0%, rgba(255, 196, 219, 0) 72%);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .sticker {
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 900;
      font-size: 0.92rem;
      border: 2px solid #ffffff;
      box-shadow: 0 8px 18px rgba(122, 99, 217, 0.18);
      white-space: nowrap;
    }

    .sticker {
      background: linear-gradient(135deg, #d7ecff, #f7deff);
      color: #5d63aa;
    }

    .mascot-panel {
      margin-top: 14px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 2px solid #f2ddff;
      border-radius: 22px;
      background:
        radial-gradient(circle at 12% 20%, rgba(255, 217, 106, 0.38), transparent 26%),
        linear-gradient(135deg, #fff7fb, #eff8ff);
      box-shadow: 0 14px 24px rgba(122, 99, 217, 0.12);
    }

    .mascot-bubble {
      width: 58px;
      height: 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #fff;
      border: 2px solid #e7dcff;
      font-size: 2rem;
      animation: mascotBounce 1.8s ease-in-out infinite;
    }

    .mascot-panel strong {
      display: block;
      font-size: 1.25rem;
      line-height: 1.2;
    }

    .mascot-panel span {
      color: var(--muted);
      font-weight: 900;
    }

    .reward-row {
      display: flex;
      gap: 8px;
      font-size: 1.8rem;
    }

    .reward-row span {
      animation: popReward 1.7s ease-in-out infinite;
    }

    .reward-row span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .reward-row span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes mascotBounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes popReward {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.18) rotate(5deg);
      }
    }

    .title-badge {
      text-align: center;
      padding: 14px 18px;
      border-radius: 24px;
      background: linear-gradient(180deg, #ccb8ff, #a892f0);
      border: 4px solid #ede4ff;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5);
      width: 100%;
    }

    .title-badge h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: #3c2e70;
    }

    .name-strip {
      margin-top: 14px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 244, 255, 0.96));
      border: 2px dashed #b9b0e8;
      border-radius: 22px;
      padding: 10px 14px;
    }

    .name-strip-head {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 6px;
      min-height: 18px;
    }

    .name-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .name-field {
      display: grid;
      gap: 5px;
    }

    .name-field label {
      font-size: 0.88rem;
      font-weight: 900;
      color: var(--muted);
    }

    .name-input {
      min-height: 50px;
      border-radius: 14px;
      border: 2px solid #d9cffd;
      background: #fff;
      padding: 10px 14px;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--ink);
    }

    .control-panel {
      margin-top: 18px;
      background: rgba(255, 255, 255, 0.85);
      border: var(--dash);
      border-radius: 22px;
      padding: 16px;
    }

    .control-panel-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-size: 0.9rem;
      font-weight: 900;
      color: var(--muted);
    }

    select,
    input[type="number"] {
      width: 100%;
      min-height: 48px;
      border-radius: 16px;
      border: 2px solid #d9cffd;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      font-size: 1rem;
      font-weight: 900;
    }

    .summary {
      width: 270px;
      background: linear-gradient(180deg, #fffdf0, #fff7fe);
      border: 2px solid #f0e2ff;
      border-radius: 18px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .summary-box {
      background: #ffffff;
      border: var(--dash);
      border-radius: 16px;
      padding: 12px;
    }

    .summary-box strong {
      display: block;
      font-size: 1.35rem;
      margin-bottom: 4px;
    }

    .summary-box span {
      display: block;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      font-weight: 800;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      min-height: 50px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 900;
      color: var(--ink);
      box-shadow: 0 10px 20px rgba(122, 99, 217, 0.16);
    }

    .primary {
      background: linear-gradient(135deg, var(--purple-deep), var(--purple));
      color: #fff;
    }

    .secondary {
      background: linear-gradient(135deg, #ffeeb7, var(--yellow));
    }

    .ghost {
      background: linear-gradient(135deg, #def0ff, #bed8ff);
    }

    .print-btn {
      background: linear-gradient(135deg, #ffdbe8, #ffc2d7);
    }

    .lang-btn {
      background: linear-gradient(135deg, #e5f5d9, #c9efb8);
    }

    .questions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .card {
      background: #fff;
      border: var(--dash);
      border-radius: 22px;
      padding: 14px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #9b84e8;
      box-shadow: 0 14px 24px rgba(122, 99, 217, 0.16);
    }

    .card.done {
      animation: cardCelebrate 0.62s ease;
      border-color: #79cf91;
      box-shadow: 0 0 0 4px rgba(121, 207, 145, 0.18);
    }

    @keyframes cardCelebrate {
      0% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.025) rotate(-0.6deg);
      }
      100% {
        transform: scale(1);
      }
    }

    .card.sequence {
      background: linear-gradient(180deg, #ffffff, #fbf8ff);
    }

    .card.addsub {
      background: linear-gradient(180deg, #ffffff, #f8fcff);
    }

    .card.blending {
      background: linear-gradient(180deg, #ffffff, #fffaf0);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-chip,
    .theme-mark {
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 900;
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .section-chip.sequence {
      background: linear-gradient(135deg, #bda8ff, #9a81ef);
      color: #fff;
    }

    .section-chip.addsub {
      background: linear-gradient(135deg, #86c0ff, #72a9ff);
      color: #fff;
    }

    .section-chip.blending {
      background: linear-gradient(135deg, #ffcf7a, #ffa8cf);
      color: #403764;
    }

    .theme-mark {
      min-width: 48px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 1.35rem;
      background: linear-gradient(135deg, #fff6fb, #ffe9f2);
      border: 2px solid #f0d6e5;
    }

    .card h3 {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.55;
    }

    .story {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.55;
      font-weight: 800;
    }

    .equation-box {
      margin-top: 16px;
      background: #fcfbff;
      border: 2px solid #e0d8ff;
      border-radius: 18px;
      padding: 16px 14px;
      text-align: center;
    }

    .equation {
      font-size: clamp(1.45rem, 3vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .visual-math {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .visual-group {
      min-width: 88px;
      display: grid;
      gap: 6px;
      justify-items: center;
    }

    .visual-count {
      font-size: 0.92rem;
      font-weight: 900;
      color: var(--muted);
    }

    .visual-icons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      max-width: 110px;
    }

    .visual-icon {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #fff;
      border: 2px solid #eadffd;
      font-size: 1.02rem;
      line-height: 1;
    }

    .visual-operator,
    .visual-equals {
      align-self: center;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--ink);
      padding-top: 16px;
    }

    .visual-answer-line {
      width: 40px;
      height: 24px;
      border-bottom: 3px solid currentColor;
      align-self: center;
      margin-top: 10px;
    }

    .shape-pattern {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      color: #574a8f;
      font-size: 2rem;
      font-weight: 900;
    }

    .shape-options {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
    }

    .shape-choice {
      min-width: 58px;
      min-height: 48px;
      border: 3px solid #d9cffd;
      border-radius: 16px;
      background: #fff;
      color: #574a8f;
      font-size: 1.65rem;
      line-height: 1;
    }

    .shape-choice.selected {
      border-color: #8e72e6;
      background: #f1ebff;
    }

    .shape-choice.correct {
      border-color: #66c480;
      background: #effcf3;
    }

    .shape-choice.wrong {
      border-color: #f08383;
      background: #fff4f4;
    }

    .blend-pictures {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .blend-picture {
      min-height: 82px;
      display: grid;
      place-items: center;
      border: 2px solid #eadffd;
      border-radius: 18px;
      background: linear-gradient(180deg, #fff, #f8f4ff);
      cursor: pointer;
      font-size: 2.35rem;
      box-shadow: none;
    }

    .blend-picture.selected {
      border-color: #9b84e8;
      background: #f1ebff;
      box-shadow: 0 0 0 4px rgba(155, 132, 232, 0.16);
    }

    .blend-picture.correct {
      border-color: #66c480;
      background: #effcf3;
    }

    .blend-picture.wrong {
      border-color: #f08383;
      background: #fff4f4;
    }

    .blend-bank {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .blend-choice {
      min-height: 42px;
      border: 2px solid #eadffd;
      border-radius: 14px;
      background: #fff;
      padding: 7px 14px;
      color: #403764;
      font-size: 1.25rem;
      font-weight: 900;
      box-shadow: none;
    }

    .blend-choice:hover {
      background: #fff5df;
    }

    .blend-choice.selected {
      border-color: #9b84e8;
      background: #f1ebff;
    }

    .blend-pattern {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #403764;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .blend-blank {
      width: 1em;
      border-bottom: 4px solid currentColor;
      transform: translateY(0.08em);
    }

    .clock-wrap {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }

    .clock-face {
      position: relative;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid #d9cffd;
      box-shadow: inset 0 0 0 6px #f7f2ff;
    }

    .clock-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      background: #574a8f;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .clock-hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: bottom center;
      border-radius: 999px;
    }

    .clock-hand.hour {
      width: 6px;
      height: 34px;
      background: #574a8f;
      margin-left: -3px;
      z-index: 2;
    }

    .clock-hand.minute {
      width: 4px;
      height: 48px;
      background: #8bb8ff;
      margin-left: -2px;
      z-index: 1;
    }

    .clock-hand.draggable {
      cursor: grab;
      touch-action: none;
    }

    .clock-hand.dragging {
      cursor: grabbing;
      filter: drop-shadow(0 0 6px rgba(122, 99, 217, 0.45));
    }

    .clock-help {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 900;
      text-align: center;
    }

    .clock-tick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 54px;
      margin-left: -1px;
      margin-top: -54px;
      transform-origin: bottom center;
    }

    .clock-tick::before {
      content: "";
      display: block;
      width: 2px;
      height: 10px;
      background: #b7a8ef;
      border-radius: 999px;
      margin: 0 auto;
    }

    .clock-label {
      min-width: 150px;
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px 8px;
      border-bottom: 4px solid #574a8f;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--muted);
      text-align: center;
    }

    .clock-number {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      margin-left: -12px;
      margin-top: -10px;
      color: #574a8f;
      font-size: 0.82rem;
      font-weight: 900;
      line-height: 20px;
      text-align: center;
    }

    .missing-line {
      display: inline-block;
      width: 2.2ch;
      height: 0.9em;
      margin: 0 0.08em;
      border-bottom: 3px solid currentColor;
      vertical-align: middle;
      transform: translateY(-0.06em);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .answer {
      flex: 1;
      min-width: 140px;
      font-size: 1.3rem;
      text-align: center;
      border-width: 3px;
    }

    .answer.correct {
      border-color: #66c480;
      background: #effcf3;
      color: #237441;
    }

    .answer.wrong {
      border-color: #f08383;
      background: #fff4f4;
      color: #ac3838;
    }

    .card.clock .answer {
      border: 0;
      border-bottom: 3px solid #b8acd9;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .tiny {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #f1eaff, #dce9ff);
    }

    .speaker-icon {
      font-size: 1.1em;
      line-height: 1;
    }

    .feedback {
      min-height: 48px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      font-weight: 800;
    }

    .feedback:empty {
      display: none;
    }

    .feedback.good {
      color: #23884c;
    }

    .feedback.bad {
      color: #b34a4a;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border: var(--dash);
      border-radius: 22px;
      padding: 28px 18px;
      color: var(--muted);
      font-size: 1.02rem;
      font-weight: 900;
    }

    .footer-note {
      margin: 18px 0 2px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 900;
    }

    @page a4-sheet {
      size: A4 landscape;
      margin: 0;
    }

    @page a3-sheet {
      size: A3 landscape;
      margin: 0;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }

      .sheet {
        page: a4-sheet;
        width: calc(100% - 12mm);
        height: 198mm;
        margin: 6mm auto;
        border: 2px solid var(--page-border);
        border-radius: 0;
        box-shadow: none;
        padding: 5mm 5mm 4mm;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      body.print-a3 .sheet {
        page: a3-sheet;
        width: calc(100% - 16mm);
        height: 281mm;
        margin: 8mm auto;
      }

      body.print-current .sheet {
        height: auto;
        min-height: 180mm;
        overflow: visible;
      }

      .sheet::before,
      .sheet::after,
      .fun-layer,
      .topbar,
      .mascot-panel,
      .control-panel,
      .footer-note,
      .family-row,
      #printBtn {
        display: none !important;

        align-content: flex-start;

      }

    function randomTens(min, max) {
      const start = Math.ceil(min / 10);

      return (Math.floor(Math.random() * (end - start + 1)) + start) * 10;

    function formatQuestion(question) {
      const text = textPack();
      if (question.type === "sequence") {
        const isReverse = question.direction === "reverse";
        return {
          title: isReverse ? text.reverseSequenceTitle : text.sequenceTitle,
          prompt: text.sequencePrompt(
            displayName(question.main),
            displayName(question.helper),
            question.theme.sequenceItem[currentLanguage]
          ),
          clue: isReverse
            ? text.reverseSequenceClue(question.numbers[0], question.numbers[question.numbers.length - 1])
            : text.sequenceClue(question.numbers[0], question.numbers[question.numbers.length - 1]),
          speech: text.sequenceSpeech(
            displayName(question.main),
            displayName(question.helper),
            question.theme.sequenceItem[currentLanguage]
          ),
          equation: question.shown.map((value) => value === null ? '<span class="missing-line"></span>' : value).join(" ")
        };
      }

      if (question.type === "clock") {
        const isDrawTask = question.clockTask === "draw";
        return {
          title: text.clockTitle,
          prompt: currentLanguage === "zh"
            ? isDrawTask
              ? `${displayName(question.main)} 同 ${displayName(question.helper)} 一齊學睇時間。請喺下面個時鐘畫出 ${question.answer} 嘅指針。`
              : `${displayName(question.main)} 同 ${displayName(question.helper)} 一齊睇時鐘。請寫返而家係幾點幾分。`
            : isDrawTask
              ? `${displayName(question.main)} and ${displayName(question.helper)} are learning time. Draw the hands for ${question.answer} on the clock below.`
              : `${displayName(question.main)} and ${displayName(question.helper)} are reading the clock. Write the time.`
          ,
          clue: currentLanguage === "zh"
            ? isDrawTask
              ? "短針表示小時，長針表示分鐘。"
              : "先睇短針，再睇長針。"
            : isDrawTask
              ? "The short hand shows the hour. The long hand shows the minutes."
              : "Look at the short hand first, then the long hand."
          ,
          speech: currentLanguage === "zh"
            ? isDrawTask
              ? `請喺時鐘畫出 ${question.answer} 嘅指針。`
              : "請睇時鐘，再寫返而家係幾點幾分。"
            : isDrawTask
              ? `Draw the clock hands for ${question.answer}.`
              : "Read the clock and write the time."
          ,
          equation: ""
        };
      }

      if (question.type === "logic") {
        if (question.logicKind === "shape") {
          return {
            title: text.logicTitle,
            prompt: currentLanguage === "zh"
              ? `${displayName(question.main)} 同 ${displayName(question.helper)} 一齊搵圖形規律。下一個應該係咩圖形？`
              : `${displayName(question.main)} and ${displayName(question.helper)} are finding the shape pattern. What comes next?`,
            clue: currentLanguage === "zh"
              ? "留意圖形重複嘅次序。"
              : "Look at the repeating order of the shapes.",
            speech: currentLanguage === "zh"
              ? "請留意圖形規律，揀出下一個圖形。"
              : "Look at the shape pattern and choose the next shape.",
            equation: `<div class="shape-pattern">${question.shown.map((value) => value === null ? '<span class="missing-line"></span>' : `<span>${value}</span>`).join("")}</div>`
          };
        }

        return {
          title: text.logicTitle,
          prompt: text.logicPrompt(displayName(question.main), displayName(question.helper)),
          clue: text.logicClue(question.step),
          speech: text.logicSpeech(displayName(question.main), displayName(question.helper)),
          equation: question.shown.map((value) => value === null ? '<span class="missing-line"></span>' : value).join(" ")
        };
      }

      if (question.type === "blending") {
        return {
          title: text.blendingTitle,
          prompt: text.blendingPrompt(),
          clue: text.blendingClue,
          speech: text.blendingSpeech(),
          equation: `<div class="blend-pattern"><span class="blend-blank"></span><span class="blend-blank"></span><span>${question.tail}</span></div>`
        };
      }

      return {
        title: question.tensMode
          ? question.isAdd ? text.tensAddTitle : text.tensSubTitle
          : question.isAdd ? text.addTitle : text.subTitle,
        prompt: question.isAdd
          ? text.addPrompt(
              displayName(question.main),
              displayName(question.helper),
              question.first,
              question.theme.addItem[currentLanguage],
              question.second
            )
          : text.subPrompt(
              displayName(question.main),
              displayName(question.helper),
              question.first,
              question.theme.addItem[currentLanguage],
              question.second
            ),
        clue: text.addsubClue,
        speech: question.isAdd
          ? text.addSpeech(
              displayName(question.main),
              displayName(question.helper),
              question.first,
              question.theme.addItem[currentLanguage],
              question.second
            )
          : text.subSpeech(
              displayName(question.main),
              displayName(question.helper),
              question.first,
              question.theme.addItem[currentLanguage],
              question.second
            ),
        equation: `${question.first} ${question.operator} ${question.second} = ?`
      };
    }

    function renderVisualMath(question) {
      if (question.type !== "addsub" || question.tensMode) {
        return "";
      }

      const icon = question.theme.visualIcon;
      const makeIcons = (count) => Array.from({ length: count }, () => `<span class="visual-icon">${icon}</span>`).join("");

      return `
        <div class="visual-math" aria-hidden="true">
          <div class="visual-group">
            <div class="visual-count">${question.first}</div>
            <div class="visual-icons">${makeIcons(question.first)}</div>
          </div>
          <div class="visual-operator">${question.operator}</div>
          <div class="visual-group">
            <div class="visual-count">${question.second}</div>
            <div class="visual-icons">${makeIcons(question.second)}</div>
          </div>
          <div class="visual-equals">=</div>
          <div class="visual-answer-line"></div>
        </div>
      `;
    }

    function renderBlending(question) {
      if (question.type !== "blending") {
        return "";
      }

      return `
        <div class="blend-pictures" aria-label="picture choices">
          ${question.pictureOptions.map((item) => `<button class="blend-picture" type="button" data-blend-picture="${item.word}">${item.picture}</button>`).join("")}
        </div>
        <div class="blend-bank" aria-label="blend choices">
          ${question.blendOptions.map((item) => `<button class="blend-choice" type="button" data-blend-choice="${item}">${item}</button>`).join("")}
        </div>
      `;
    }

    function renderClock(question) {
      if (question.type !== "clock") {
        return "";
      }

      const hourRotation = (question.hour % 12) * 30 + (question.minute * 0.5);
      const minuteRotation = question.minute * 6;
      const ticks = Array.from({ length: 12 }, (_, index) =>
        `<div class="clock-tick" style="transform: rotate(${index * 30}deg)"></div>`
      ).join("");
      const numbers = Array.from({ length: 12 }, (_, index) => {
        const number = index + 1;
        const rotation = number * 30;
        return `<div class="clock-number" style="transform: rotate(${rotation}deg) translateY(-48px) rotate(-${rotation}deg)">${number}</div>`;
      }).join("");
      const drawHourRotation = ((question.drawHour || 12) % 12) * 30;
      const drawMinuteRotation = (question.drawMinute || 0) * 6;
      const hands = question.clockTask === "draw"
        ? `
            <div class="clock-hand hour draggable" data-clock-hand="hour" style="transform: rotate(${drawHourRotation}deg)"></div>
            <div class="clock-hand minute draggable" data-clock-hand="minute" style="transform: rotate(${drawMinuteRotation}deg)"></div>
            <div class="clock-center"></div>
          `
        : `
            <div class="clock-hand hour" style="transform: rotate(${hourRotation}deg)"></div>
            <div class="clock-hand minute" style="transform: rotate(${minuteRotation}deg)"></div>
            <div class="clock-center"></div>
          `;

      return `
        <div class="clock-wrap">
          <div class="clock-face" data-clock-face="${question.clockTask}">
            ${ticks}
            ${numbers}
            ${hands}
          </div>
          <div class="clock-label">${question.clockTask === "draw" ? question.answer : "__ : __"}</div>
          ${question.clockTask === "draw" ? '<div class="clock-help">拖動短針同長針</div>' : ""}
        </div>
      `;
    }

    function updateMissionSummary() {
      const text = textPack();
      const mode = modeSelect.value;
      const missionByMode = {
        sequence: text.missionSequence,
        reverseSequence: text.missionReverseSequence,
        clock: text.missionClock,
        logic: text.missionLogic,
        add: text.missionAdd,
        sub: text.missionSub,

        tensSub: text.missionTensSub,
        blending: text.missionBlending
      };

      missionSubtext.textContent = text.missionSubtext;

    function createSequenceQuestion(level, direction = "forward") {
      const theme = pick(themes);
      const main = pick(family);
      const helper = pickHelper(main);
      const length = level === "challenge" ? 6 : 5;
      const isReverse = direction === "reverse";
      const start = isReverse
        ? Math.floor(Math.random() * (101 - length)) + length
        : Math.floor(Math.random() * (101 - length)) + 1;
      const hideIndex = level === "easy"
        ? Math.floor(Math.random() * 2) + 1
        : Math.floor(Math.random() * (length - 2)) + 1;
      const numbers = Array.from({ length }, (_, index) => start + (isReverse ? -index : index));
      const answer = numbers[hideIndex];
      const shown = numbers.map((value, index) => (index === hideIndex ? null : value));

      return {
        type: "sequence",
        theme,
        main,
        helper,
        direction,
        numbers,
        shown,
        answer
      };
    }

    function createClockQuestion() {
      const theme = pick(themes);
      const main = pick(family);
      const helper = pickHelper(main);
      const hour = Math.floor(Math.random() * 12) + 1;
      const minute = pick([0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]);
      const clockTask = Math.random() < 0.5 ? "draw" : "read";

      return {
        type: "clock",
        theme,
        main,
        helper,
        hour,
        minute,
        clockTask,
        answer: `${hour}:${String(minute).padStart(2, "0")}`
      };
    }

    function createLogicQuestion() {
      if (Math.random() < 0.5) {
        return createShapeLogicQuestion();
      }

      return createNumberLogicQuestion();
    }

    function createNumberLogicQuestion() {
      const theme = pick(themes);
      const main = pick(family);
      const helper = pickHelper(main);
      const stepChoices = [1, 2, 5, 10];
      const step = pick(stepChoices);
      const startMax = 100 - (step * 4);
      const start = Math.floor(Math.random() * startMax) + 1;
      const numbers = Array.from({ length: 5 }, (_, index) => start + (step * index));
      const hideIndex = 3;
      const answer = numbers[hideIndex];
      const shown = numbers.map((value, index) => (index === hideIndex ? null : value));

      return {
        type: "logic",
        logicKind: "number",
        theme,
        main,
        helper,
        step,
        shown,
        answer
      };
    }

    function createShapeLogicQuestion() {
      const theme = pick(themes);
      const main = pick(family);
      const helper = pickHelper(main);
      const shapePairs = [
        ["▲", "●"],
        ["◆", "■"],
        ["★", "●"],
        ["■", "▲"]
      ];
      const shapes = pick(shapePairs);
      const answer = shapes[0];
      const shown = [shapes[0], shapes[1], shapes[0], shapes[1], null];
      const distractors = ["▲", "●", "◆", "■", "★"].filter((shape) => shape !== answer);
      const options = [answer, ...distractors.sort(() => Math.random() - 0.5).slice(0, 2)]
        .sort(() => Math.random() - 0.5);

      return {
        type: "logic",
        logicKind: "shape",
        theme,
        main,
        helper,
        shown,
        options,
        answer
      };
    }

    function createBlendingQuestion() {
      const target = pick(blendingWords);
      const pictureOptions = [target, ...blendingWords
        .filter((item) => item.word !== target.word)
        .sort(() => Math.random() - 0.5)
        .slice(0, 2)]
        .sort(() => Math.random() - 0.5);
      const distractors = blendChoices
        .filter((item) => item !== target.blend)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);
      const blendOptions = [target.blend, ...distractors].sort(() => Math.random() - 0.5);

      return {
        type: "blending",
        theme: {
          label: "English Blending",
          stamp: "ABC"
        },
        pictureOptions,
        tail: target.tail,
        word: target.word,
        blendOptions,
        answer: target.blend
      };
    }

    function pickDoubleDigitNumbers(isAdd, level) {
      const pools = {
        easy: [10, 20, 30, 40, 50, 60, 70, 80, 90],
        normal: [15, 25, 35, 45, 55, 65, 75, 85]
      };

      if (level === "easy" || level === "normal") {
        const pool = pools[level];
        let first = pick(pool);
        let second = pick(pool);
        while (isAdd ? first + second > 100 : second > first) {
          first = pick(pool);
          second = pick(pool);
        }
        return [first, second];
      }

      let first = Math.floor(Math.random() * 90) + 10;
      let second = Math.floor(Math.random() * 90) + 10;
      const isNoCarry = (a, b) => (a % 10) + (b % 10) < 10;
      const isNoBorrow = (a, b) => (a % 10) >= (b % 10);

      while (isAdd
        ? first + second > 100 || !isNoCarry(first, second)
        : second > first || !isNoBorrow(first, second)) {
        first = Math.floor(Math.random() * 90) + 10;
        second = Math.floor(Math.random() * 90) + 10;
      }

      return [first, second];
    }

    function createAddSubQuestion(forceMode = "mixed", level = "normal") {
      const theme = pick(themes);
      const main = pick(family);
      const helper = pickHelper(main);
      const tensMode = forceMode === "tensAdd" || forceMode === "tensSub";
      const isAdd = forceMode === "add" || forceMode === "tensAdd"
        ? true
        : forceMode === "sub" || forceMode === "tensSub"
          ? false
          : Math.random() > 0.45;
      let first;
      let second;

      if (tensMode) {
        [first, second] = pickDoubleDigitNumbers(isAdd, level);
      } else {
        first = Math.floor(Math.random() * 9) + 1;
        second = Math.floor(Math.random() * 9) + 1;
      }

      if (!tensMode) {
        if (isAdd) {
          while (first + second > 10) {
            first = Math.floor(Math.random() * 9) + 1;
            second = Math.floor(Math.random() * 9) + 1;
          }
        } else if (second > first) {
          [first, second] = [second, first];
        }
      }

      return {
        type: "addsub",
        theme,
        main,
        helper,
        first,
        second,
        isAdd,
        tensMode,
        operator: isAdd ? "+" : "-",
        answer: isAdd ? first + second : first - second
      };
    }

    function generateQuestions() {
      const mode = modeSelect.value;
      const count = Number(countSelect.value);
      const level = sequenceLevel.value;

      currentQuestions = Array.from({ length: count }, (_, index) => {
        let question;
        if (mode === "sequence") {
          question = createSequenceQuestion(level);
        } else if (mode === "reverseSequence") {
          question = createSequenceQuestion(level, "reverse");
        } else if (mode === "clock") {
          question = createClockQuestion();
        } else if (mode === "logic") {
          question = createLogicQuestion();
        } else if (mode === "add") {
          question = createAddSubQuestion("add");
        } else if (mode === "sub") {
          question = createAddSubQuestion("sub");
        } else if (mode === "tensAdd") {
          question = createAddSubQuestion("tensAdd", level);
        } else if (mode === "tensSub") {
          question = createAddSubQuestion("tensSub", level);
        } else if (mode === "blending") {
          question = createBlendingQuestion();
        } else {
          const builders = [
            () => createSequenceQuestion(level),
            () => createSequenceQuestion(level, "reverse"),
            () => createClockQuestion(),
            () => createLogicQuestion(),
            () => createAddSubQuestion("add"),
            () => createAddSubQuestion("sub"),
            () => createAddSubQuestion("tensAdd", level),
            () => createAddSubQuestion("tensSub", level),
            () => createBlendingQuestion()
          ];
          question = pick(builders)();
        }

        return {
          id: index + 1,
          ...question
        };
      });

      renderQuestions();
      scoreText.textContent = textPack().scoreReady;
      scoreSubtext.textContent = textPack().scoreReadySub(count);
      updateMissionSummary();
    }

    function renderQuestions() {
      if (!currentQuestions.length) {
        questionsEl.innerHTML = `<div class="empty">${textPack().emptyState}</div>`;
        return;
      }

      questionsEl.innerHTML = currentQuestions.map((question) => {
        const view = formatQuestion(question);
        return `
          <article class="card ${question.type} ${question.clockTask || ""}" data-id="${question.id}">
            <div class="card-head">
              <div class="section-chip ${question.type}">${currentLanguage === "zh" ? `第 ${question.id} 題・${view.title}` : `Q${question.id} · ${view.title}`}</div>
              <div class="theme-mark" aria-label="${question.theme.label}">${question.theme.stamp}</div>
            </div>

            <h3>${view.prompt}</h3>
            <p class="story">${question.type === "blending" || currentLanguage !== "zh" ? "Hint: " : "提示："}${view.clue}</p>

            <div class="equation-box">
              ${renderBlending(question)}
              ${question.type === "clock" ? renderClock(question) : `<div class="equation">${view.equation}</div>`}
              ${renderVisualMath(question)}
              ${question.type === "logic" && question.logicKind === "shape"
                ? `<div class="shape-options">${question.options.map((option) => `<button class="shape-choice" type="button" data-shape-choice="${option}">${option}</button>`).join("")}</div>`
                : ""}
            </div>

            <div class="input-row">
              ${(question.type === "clock" && question.clockTask === "draw") || (question.type === "logic" && question.logicKind === "shape") ? "" : `
                <input
                  class="answer"
                  type="${question.type === "clock" || question.type === "blending" ? "text" : "number"}"
                  inputmode="${question.type === "clock" || question.type === "blending" ? "text" : "numeric"}"
                  ${question.type === "clock" || question.type === "blending" ? "" : 'pattern="[0-9]*" min="0" max="100"'}
                  placeholder="${question.type === "clock" ? "" : textPack().answerPlaceholder}"
                  aria-label="${currentLanguage === "zh" ? `第 ${question.id} 題答案` : `Answer for question ${question.id}`}"
                />
              `}
              <button class="tiny" type="button" data-speak="${question.id}"><span class="speaker-icon" aria-hidden="true">🔊</span>${textPack().readQuestion}</button>
            </div>

            <div class="feedback"></div>
          </article>
        `;
      }).join("");
    }

    function normalizeClockAnswer(value) {
      const match = String(value).trim().match(/^(\d{1,2})\s*[:：]\s*(\d{1,2})$/);
      if (!match) {
        return "";
      }

      return `${Number(match[1])}:${String(Number(match[2])).padStart(2, "0")}`;
    }

    function angleFromPointer(event, face) {
      const box = face.getBoundingClientRect();
      const centerX = box.left + box.width / 2;
      const centerY = box.top + box.height / 2;
      const radians = Math.atan2(event.clientY - centerY, event.clientX - centerX);
      return (radians * 180 / Math.PI + 90 + 360) % 360;
    }

    function updateClockHand(hand, event) {
      const card = hand.closest(".card");
      const face = hand.closest(".clock-face");
      const question = currentQuestions.find((item) => item.id === Number(card.dataset.id));
      if (!question) {
        return;
      }

      const rawAngle = angleFromPointer(event, face);
      const handType = hand.dataset.clockHand;
      const snap = handType === "minute" ? 30 : 30;
      const angle = Math.round(rawAngle / snap) * snap % 360;
      hand.style.transform = `rotate(${angle}deg)`;

      if (handType === "minute") {
        question.drawMinute = angle === 360 ? 0 : angle / 6;
      } else {
        const hour = angle === 0 ? 12 : angle / 30;
        question.drawHour = hour;
      }
    }

    function checkAnswers(showAnswers) {
      if (!currentQuestions.length) {
        scoreText.textContent = textPack().scoreEmpty;
        scoreSubtext.textContent = textPack().scoreNeedGenerate;
        return;
      }

      const cards = Array.from(document.querySelectorAll(".card"));
      let correctCount = 0;
      let gradableCount = 0;
      let drawingCount = 0;

      cards.forEach((card, index) => {
        const input = card.querySelector(".answer");
        const feedback = card.querySelector(".feedback");
        const question = currentQuestions[index];
        const view = formatQuestion(question);
        card.classList.remove("done");

        if (question.type === "logic" && question.logicKind === "shape") {
          gradableCount += 1;
          const choices = Array.from(card.querySelectorAll(".shape-choice"));
          let selected = card.querySelector(".shape-choice.selected");

          choices.forEach((choice) => choice.classList.remove("correct", "wrong"));
          feedback.classList.remove("good", "bad");

          if (showAnswers) {
            selected = choices.find((choice) => choice.dataset.shapeChoice === question.answer);
            selected.classList.add("selected");
          }

          if (!selected) {
            feedback.classList.add("bad");
            feedback.textContent = textPack().missingAnswer(view.clue);
          } else if (selected.dataset.shapeChoice === question.answer) {
            correctCount += 1;
            card.classList.add("done");
            selected.classList.add("correct");
            feedback.classList.add("good");
            feedback.textContent = pick(textPack().praiseGood);
          } else {
            selected.classList.add("wrong");
            feedback.classList.add("bad");
            feedback.textContent = textPack().wrongAnswer(pick(textPack().praiseTry), question.answer);
          }
          return;
        }

        if (question.type === "blending") {
          gradableCount += 1;
          const pictureChoices = Array.from(card.querySelectorAll(".blend-picture"));
          const selectedPicture = card.querySelector(".blend-picture.selected");
          const value = input ? input.value.trim().toLowerCase() : "";
          const pictureIsCorrect = selectedPicture?.dataset.blendPicture === question.word;
          const wordIsCorrect = value === question.answer;

          pictureChoices.forEach((choice) => choice.classList.remove("correct", "wrong"));
          if (showAnswers) {
            const targetPicture = pictureChoices.find((choice) => choice.dataset.blendPicture === question.word);
            if (targetPicture) {
              targetPicture.classList.add("selected", "correct");
            }
            input.value = question.answer;
          }

          input.classList.remove("correct", "wrong");
          feedback.classList.remove("good", "bad");

          if (pictureIsCorrect && wordIsCorrect) {
            correctCount += 1;
            card.classList.add("done");
            selectedPicture.classList.add("correct");
            input.classList.add("correct");
            feedback.classList.add("good");
            feedback.textContent = pick(textPack().praiseGood);
          } else if (!selectedPicture || value === "") {
            feedback.classList.add("bad");
            feedback.textContent = "Choose the picture and fill in the blend.";
          } else {
            selectedPicture.classList.add(pictureIsCorrect ? "correct" : "wrong");
            input.classList.add(wordIsCorrect ? "correct" : "wrong");
            feedback.classList.add("bad");
            feedback.textContent = textPack().wrongAnswer(pick(textPack().praiseTry));
          }
          return;
        }

        if (!input && question.type === "clock" && question.clockTask === "draw") {
          gradableCount += 1;
          const hourHand = card.querySelector('[data-clock-hand="hour"]');
          const minuteHand = card.querySelector('[data-clock-hand="minute"]');
          const targetHour = question.hour;
          const targetMinute = question.minute;

          if (showAnswers) {
            question.drawHour = targetHour;
            question.drawMinute = targetMinute;
            if (hourHand) {
              hourHand.style.transform = `rotate(${(targetHour % 12) * 30}deg)`;
            }
            if (minuteHand) {
              minuteHand.style.transform = `rotate(${targetMinute * 6}deg)`;
            }
          }

          const hasMovedHands = question.drawHour !== undefined || question.drawMinute !== undefined;
          const isCorrect = question.drawHour === targetHour && question.drawMinute === targetMinute;
          feedback.classList.remove("good", "bad");

          if (isCorrect) {
            correctCount += 1;
            card.classList.add("done");
            feedback.classList.add("good");
            feedback.textContent = pick(textPack().praiseGood);
          } else if (!hasMovedHands) {
            feedback.classList.add("bad");
            feedback.textContent = currentLanguage === "zh"
              ? "請拖動短針同長針。"
              : "Move the hour hand and the minute hand.";
          } else {
            feedback.classList.add("bad");
            feedback.textContent = textPack().wrongAnswer(pick(textPack().praiseTry));
          }
          return;
        }

        if (!input) {
          drawingCount += 1;
          feedback.classList.remove("good", "bad");
          feedback.textContent = currentLanguage === "zh"
            ? "請直接喺鐘面畫出指針。"
            : "Draw the hands directly on the clock face.";
          return;
        }

        gradableCount += 1;

        if (showAnswers) {
          input.value = question.answer;
        }

        const value = question.type === "clock"
          ? normalizeClockAnswer(input.value)
          : question.type === "blending"
            ? input.value.trim().toUpperCase()
            : Number(input.value);
        const isCorrect = input.value !== "" && value === question.answer;

        input.classList.remove("correct", "wrong");
        feedback.classList.remove("good", "bad");

        if (isCorrect) {
          correctCount += 1;
          card.classList.add("done");
          input.classList.add("correct");
          feedback.classList.add("good");
          feedback.textContent = pick(textPack().praiseGood);
        } else if (input.value === "") {
          feedback.classList.add("bad");
          feedback.textContent = textPack().missingAnswer(view.clue);
        } else {
          input.classList.add("wrong");
          feedback.classList.add("bad");
          feedback.textContent = textPack().wrongAnswer(pick(textPack().praiseTry), question.answer);
        }
      });

      scoreText.textContent = drawingCount > 0
        ? currentLanguage === "zh"
          ? `${correctCount} / ${gradableCount} 題答啱，另有 ${drawingCount} 題畫指針`
          : `${correctCount} / ${gradableCount} correct, plus ${drawingCount} drawing question${drawingCount > 1 ? "s" : ""}`
        : textPack().summaryLine(correctCount, currentQuestions.length);
      if (gradableCount === 0) {
        scoreSubtext.textContent = currentLanguage === "zh"
          ? "完成後可以一齊對照時間檢查指針。"
          : "Check the clock hands together when finished.";
      } else if (correctCount === gradableCount) {
        scoreSubtext.textContent = textPack().summaryPerfect;
      } else if (correctCount >= Math.ceil(gradableCount * 0.6)) {
        scoreSubtext.textContent = textPack().summaryGood;
      } else {
        scoreSubtext.textContent = textPack().summaryTry;
      }
    }

    function speakQuestionById(id) {
      if (soundToggle.value === "off" || !("speechSynthesis" in window)) {
        return;
      }

      const question = currentQuestions.find((item) => item.id === Number(id));
      if (!question) {
        return;
      }

      const view = formatQuestion(question);
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(view.speech);
      utterance.lang = currentLanguage === "zh" ? "zh-HK" : "en-US";
      utterance.rate = 0.92;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    const printPageStyle = document.createElement("style");
    document.head.appendChild(printPageStyle);

    function printWorksheet(size, count) {
      document.body.classList.toggle("print-a3", size === "a3");
      document.body.classList.toggle("print-current", size === "current");
      printPageStyle.textContent = size === "a3"
        ? "@page { size: A3 landscape; margin: 0; }"
        : "@page { size: A4 landscape; margin: 0; }";
      countSelect.value = String(count);
      generateQuestions();
      requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
    }

    window.addEventListener("afterprint", () => {
      document.body.classList.remove("print-a3");
      document.body.classList.remove("print-current");
      printPageStyle.textContent = "";
    });

    document.getElementById("generateBtn").addEventListener("click", generateQuestions);
    document.getElementById("checkBtn").addEventListener("click", () => checkAnswers(false));
    document.getElementById("showBtn").addEventListener("click", () => checkAnswers(true));
    document.getElementById("printBtn").addEventListener("click", () => printWorksheet("a4", 10));
    document.getElementById("printA3Btn").addEventListener("click", () => printWorksheet("a3", 20));
    document.getElementById("printCurrentBtn").addEventListener("click", () => printWorksheet("current", Number(countSelect.value)));
    document.getElementById("languageBtn").addEventListener("click", () => {
      currentLanguage = currentLanguage === "zh" ? "en" : "zh";
      applyLanguage();
      renderQuestions();
      if (currentQuestions.length) {
        updateMissionSummary();
        scoreText.textContent = textPack().scoreReady;
        scoreSubtext.textContent = textPack().scoreReadySub(Number(countSelect.value));
      } else {
        scoreText.textContent = textPack().scoreStart;
        scoreSubtext.textContent = textPack().scoreNeedGenerate;
        missionText.textContent = textPack().missionDefault;
        missionSubtext.textContent = textPack().missionSubtext;
      }
    });

    questionsEl.addEventListener("pointerdown", (event) => {
      const hand = event.target.closest("[data-clock-hand]");
      if (!hand) {
        return;
      }

      event.preventDefault();
      hand.classList.add("dragging");
      hand.setPointerCapture(event.pointerId);
      updateClockHand(hand, event);
    });

    questionsEl.addEventListener("pointermove", (event) => {
      const hand = event.target.closest("[data-clock-hand]");
      if (!hand || !hand.classList.contains("dragging")) {
        return;
      }

      updateClockHand(hand, event);
    });

    questionsEl.addEventListener("pointerup", (event) => {
      const hand = event.target.closest("[data-clock-hand]");
      if (!hand) {
        return;
      }

      hand.classList.remove("dragging");
    });

    questionsEl.addEventListener("pointercancel", (event) => {
      const hand = event.target.closest("[data-clock-hand]");
      if (hand) {
        hand.classList.remove("dragging");
      }
    });

    questionsEl.addEventListener("click", (event) => {
      const blendPicture = event.target.closest("[data-blend-picture]");
      if (blendPicture) {
        const card = blendPicture.closest(".card");
        card.querySelectorAll(".blend-picture").forEach((choice) => {
          choice.classList.remove("selected", "correct", "wrong");
        });
        blendPicture.classList.add("selected");
        return;
      }

      const blendChoice = event.target.closest("[data-blend-choice]");
      if (blendChoice) {
        const card = blendChoice.closest(".card");
        const input = card.querySelector(".answer");
        card.querySelectorAll(".blend-choice").forEach((choice) => choice.classList.remove("selected"));
        blendChoice.classList.add("selected");
        if (input) {
          input.value = blendChoice.dataset.blendChoice;
        }
        return;
      }

      const shapeChoice = event.target.closest("[data-shape-choice]");
      if (shapeChoice) {
        shapeChoice.closest(".shape-options").querySelectorAll(".shape-choice").forEach((choice) => {
          choice.classList.remove("selected", "correct", "wrong");
        });
        shapeChoice.classList.add("selected");
        return;
      }

      const trigger = event.target.closest("[data-speak]");
      if (!trigger) {
        return;
      }
      speakQuestionById(trigger.dataset.speak);
    });

    questionsEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        checkAnswers(false);
      }
    });

    applyLanguage();
    scoreText.textContent = textPack().scoreStart;
    scoreSubtext.textContent = textPack().scoreNeedGenerate;
    missionText.textContent = textPack().missionDefault;
    missionSubtext.textContent = textPack().missionSubtext;
    generateQuestions();
  </script>
</body>
</html>
