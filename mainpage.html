<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadon Leaning Portal</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #1a2433;
      --muted: #607089;
      --accent: #0b74de;
      --accent-2: #1557b0;
      --border: #dbe4f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans HK", sans-serif;
      background: linear-gradient(160deg, #f7fbff 0%, #eef4ff 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px 16px 12px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav-wrap {
      display: flex;
      justify-content: center;
      padding: 8px 12px 16px;
    }

    .nav {
      display: flex;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 6px 18px rgba(21, 87, 176, 0.08);
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .tab:hover {
      background: #eaf3ff;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 8px 12px 16px;
    }

    @media (max-width: 760px) {
      .header h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Jadon Leaning Portal</h1>
    <p>一個網站入口，整合主頁、數學 Quiz、數學 Word。</p>
  </header>

  <div class="nav-wrap">
    <nav class="nav" aria-label="Website navigation">
      <a class="tab" href="https://luclklam2.github.io/Kelvin.lin.github.io/index.html">主頁 Home</a>
      <a class="tab" href="https://luclklam2.github.io/math/quiz.html">Math Quiz</a>
      <a class="tab" href="https://luclklam2.github.io/math/word.html">中文</a>
    </nav>
  </div>

  <footer class="footer">
    已改為直接全頁跳轉，避免內容縮細。
  </footer>
</body>
</html>
