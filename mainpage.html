
<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadon Leaning Portal</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #1a2433;
      --muted: #607089;
      --accent: #0b74de;
      --accent-2: #1557b0;
      --border: #dbe4f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans HK", sans-serif;
      background: linear-gradient(160deg, #f7fbff 0%, #eef4ff 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px 16px 12px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav-wrap {
      display: flex;
      justify-content: center;
      padding: 8px 12px 16px;
    }

    .nav {
      display: flex;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 6px 18px rgba(21, 87, 176, 0.08);
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab:hover {
      background: #eaf3ff;
    }

    .tab.active {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .viewer {
      width: min(1200px, calc(100% - 24px));
      margin: 0 auto 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(12, 37, 77, 0.1);
      flex: 1;
      min-height: 72vh;
    }

    iframe {
      width: 100%;
      height: 72vh;
      min-height: 560px;
      border: 0;
      background: #fff;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 8px 12px 16px;
    }

    @media (max-width: 760px) {
      .header h1 { font-size: 1.2rem; }
      iframe { min-height: 68vh; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Jadon Leaning Portal</h1>
    <p>一個網站入口，整合主頁、數學 Quiz、數學 Word。</p>
  </header>

  <div class="nav-wrap">
    <nav class="nav" aria-label="Website navigation">
      <button class="tab active" data-url="https://luclklam2.github.io/Kelvin.lin.github.io/index.html">主頁 Home</button>
      <button class="tab" data-url="https://luclklam2.github.io/math/quiz.html">Math Quiz</button>
      <button class="tab" data-url="https://luclklam2.github.io/math/word.html">中文</button>
    </nav>
  </div>

  <main class="viewer">
    <iframe id="siteFrame" title="Combined website" src="https://luclklam2.github.io/Kelvin.lin.github.io/index.html" loading="eager"></iframe>
  </main>

  <footer class="footer">
    如某頁禁止被內嵌，請按上面分頁後再用新分頁開啟。
  </footer>

  <script>
    const frame = document.getElementById('siteFrame');
    const tabs = Array.from(document.querySelectorAll('.tab'));

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        frame.src = tab.dataset.url;
      });
    });
  </script>
</body>
</html>
